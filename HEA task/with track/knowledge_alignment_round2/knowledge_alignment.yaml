evidence:
  - evidence_id: E001
    source_type: "paper"
    source_name: "Zhang et al. 2025, A multimodal robotic platform for multi-element electrocatalyst discovery"
    identifier_or_url: "https://doi.org/10.1038/s41586-025-09640-5"
    location: "Main text, Results around paragraphs describing Formate oxidation campaign; supplied file lines 395-403; Supplementary Table 1 needed to resolve price/recipe details"
    content_summary: "Names Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr space; reports ternary recipe ~3.5x power at same metal molarity; listed six-element recipe 5.6x power; eight-element recipe 9.3x power normalized by catalyst cost; uses LSV proxy with constant ORR overpotential assumption and states ranking compared against fuel-cell experiments. Listed six fractions sum to 1.001, likely rounding but Supplementary Table 1 must confirm. Main text also reports 325 mW cm^-2 device peak power at 2.0 mg cm^-2 total metal and approximately 1.2 mg cm^-2 precious-metal loading."
    evidence_use: "value"
    quality: "high"
  - evidence_id: E002
    source_type: "paper"
