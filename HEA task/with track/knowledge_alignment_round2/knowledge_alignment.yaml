schema_version: "scientific-knowledge-alignment/0.2.0"
round: 2
project:
  name: "Eight-component catalyst composition and cost alignment"
  goal: "Optimize peak areal power density of a target electrochemical device while accounting for precious-metal/material cost within an eight-element Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr candidate space."
  domain: "Multicomponent electrocatalysis, direct formate fuel cells (adjacent supplied precedent), composition optimization"
  application_context: "Exact target device/reaction must be confirmed; primary supplied precedent uses formate oxidation with ORR counter electrode in direct formate fuel cell."
  expert_request: "Round 2 incorporates domain-expert endorsement of Round 1 concepts plus request for element properties, synergy and composition effects, material cost, computable metrics, and precise data representation."
  web_search_allowed: true
  status: "working_knowledge_accepted_with_unresolved_technical_details"
  evidence_priority: "supplied papers primary; NIST/CIAAW and USGS authoritative terminology/data; other sources supplementary"
composition_contract:
  composition_order: ["Pd", "Pt", "Cu", "Au", "Ir", "Ce", "Nb", "Cr"]
  canonical_unit: "atomic_fraction"
  data_type: "finite JSON number/double"
  domain: {minimum: 0.0, maximum: 1.0}
  closure: "sum(x_i)=1; numeric tolerance is assay/protocol-defined and still pending"
  presence_policy: "pending; choose subset_allowed or all_positive"
  null_semantics: "unknown/not measured; not equivalent to zero"
  nominal_and_measured_composition_separate: true
  output_schema_file: "composition_data_contract.json"
  record_grain: "one sample/device run, with batch, protocol, conditions and replicates"
  cost_price_vintage: "USGS 2025 commodity summary, generally reporting 2024 annual averages/estimates; raw-price forms differ"
concepts:
  - concept_id: C001
    name: "Eight-element candidate space"
    definition: "The allowed symbols are Pd, Pt, Cu, Au, Ir, Ce, Nb and Cr in fixed canonical order. Candidate space does not imply every optimized recipe has positive content of every allowed element."
    synonyms: ["octonary element space", "eight-component chemical space"]
    parent_concept: "Composition design space"
    ontology_source: {name: "Project-local concept aligned to Zhang et al. 2025", iri_or_url: "https://doi.org/10.1038/s41586-025-09640-5", version_or_access_date: "Accessed 2026-10-27"}
    mapping_status: "local"
    evidence: [E001, E002]
    expert_status: "design_object_or_objective_roles_confirmed_details_unverified"
  - concept_id: C002
    name: "Atomic-fraction composition vector"
    definition: "Ordered vector x=(x_Pd,x_Pt,x_Cu,x_Au,x_Ir,x_Ce,x_Nb,x_Cr) with 0<=x_i<=1 and sum x_i=1 when the record is closed and expressed as atomic fractions."
    synonyms: ["composition vector", "atomic composition"]
    parent_concept: "Compositional data"
    ontology_source: {name: "Compositional data literature; project-local fixed element order", iri_or_url: "https://doi.org/10.1111/j.2517-6161.1982.tb01195.x", version_or_access_date: "Accessed 2026-10-27"}
    mapping_status: "close"
    evidence: [E001, E002, E003]
    expert_status: "pending"
  - concept_id: C003
    name: "Precious-metal fraction"
    definition: "Declared sum of elemental mass fractions over an explicitly listed precious-metal set. Report PGM subset {Pd,Pt,Ir} separately from broader set {Pd,Pt,Ir,Au}; do not treat categories as interchangeable."
    synonyms: ["PGM loading", "precious-metal loading"]
    parent_concept: "Mass fraction"
    ontology_source: {name: "USGS PGM classification plus project-local precious-metal accounting", iri_or_url: "https://pubs.usgs.gov/periodicals/mcs2025/mcs2025-platinum-group.pdf", version_or_access_date: "2025 report; accessed 2026-10-27"}
    mapping_status: "local"
    evidence: [E006, E007]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - concept_id: C004
    name: "Public-price raw-material cost proxy"
    definition: "Composition-weighted sum of public elemental/material benchmark prices after declared currency, unit, year, and chemical-form conversion. It is not a supplier quote or synthesized catalyst cost."
    synonyms: ["composition-weighted commodity cost index"]
    parent_concept: "Cost indicator"
    ontology_source: {name: "Project-local metric using USGS Mineral Commodity Summaries benchmarks", iri_or_url: "https://pubs.usgs.gov/publication/mcs2025", version_or_access_date: "2025 summary; accessed 2026-10-27"}
    mapping_status: "local"
    evidence: [E007, E008, E009, E010, E011, E012]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - concept_id: C005
    name: "Cost-specific device performance"
    definition: "Device performance divided by a defined catalyst/material cost basis. Numerator, denominator, unit and comparison must be explicit; CRESt wording indicates power density normalized by catalyst cost, but its exact operational equation needs supplementary verification."
    synonyms: ["power density per catalyst cost", "cost-specific performance"]
    parent_concept: "Specific performance metric"
    ontology_source: {name: "Project-local; terminology in Zhang et al. 2025", iri_or_url: "https://doi.org/10.1038/s41586-025-09640-5", version_or_access_date: "Accessed 2026-10-27"}
    mapping_status: "local"
    evidence: [E001, E002]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - concept_id: C006
    name: "Peak areal device power density"
    definition: "Maximum of V_cell*I/A_geo over a declared device polarization response. Areal normalization basis and device/test conditions must be fixed."
    synonyms: ["maximum power density", "maximum areal power density"]
    parent_concept: "Electrochemical device performance"
    ontology_source: {name: "Project-local metric; IUPAC nomenclature and FCTESQA test module inform terms/procedure", iri_or_url: "https://doi.org/10.1351/pac199365051009", version_or_access_date: "Accessed 2026-10-27"}
    mapping_status: "local"
    evidence: [E001, E002, E013]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
elements:
  - {symbol: "Pd", order: 1, atomic_number: 46, standard_atomic_weight_u: 106.42, catalytic_context: "Primary formate-oxidation active-metal benchmark in supplied CRESt study; reported metallic state under the study's characterization.", possible_synergy: "Co-alloying can change adsorption/poisoning and active-site environments; exact eight-element marginal effect unresolved.", fraction_effect_hypothesis: "More Pd can increase active-metal inventory but raise precious-metal cost and alter site ensemble; non-monotonic power response possible.", evidence: [E001, E002, E004], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Pt", order: 2, atomic_number: 78, standard_atomic_weight_u: 195.084, catalytic_context: "PGM alloy component; alloy literature supports electronic/intermediate-binding changes in Pt/Pd systems.", possible_synergy: "May tune adsorption, selectivity and poisoning resistance with Pd and other alloy components; exact synergy not isolated.", fraction_effect_hypothesis: "May alter voltage/current and increases precious-metal mass/cost; no monotonic sign established.", evidence: [E001, E002, E004], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Cu", order: 3, atomic_number: 29, standard_atomic_weight_u: 63.546, catalytic_context: "Lower-cost transition-metal component in ternary Pd-Pt-Cu and octonary space.", possible_synergy: "Potential ligand/ensemble/strain and intermediate-binding effects in Pd/Pt alloys; transfer to octonary system uncertain.", fraction_effect_hypothesis: "Can dilute precious content and change active-site structure; excessive substitution may reduce active-site density; non-monotonic expected.", evidence: [E001, E002, E004], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Au", order: 4, atomic_number: 79, standard_atomic_weight_u: 196.96657, catalytic_context: "Noble-metal component included in cost-normalized octonary CRESt recipe; alloy FAO studies discuss noble-metal-dependent intermediate binding.", possible_synergy: "Possible changes to adsorption/poisoning/selectivity with Pd/Pt; no isolated CRESt causal effect.", fraction_effect_hypothesis: "May change kinetics and increases raw-material cost; sign and dose response unestablished.", evidence: [E001, E002, E004], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Ir", order: 5, atomic_number: 77, standard_atomic_weight_u: 192.217, catalytic_context: "PGM in CRESt power-focused six-element recipe and octonary search; Pt/Pd bimetallic theory indicates reactive alloy partners can change intermediate energetics.", possible_synergy: "Could alter formate/intermediate binding and oxidation pathways; multicomponent transfer uncertain.", fraction_effect_hypothesis: "May tune reaction kinetics but increases PGM cost; no monotonic peak-power effect inferred.", evidence: [E001, E002, E004], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Ce", order: 6, atomic_number: 58, standard_atomic_weight_u: 140.116, catalytic_context: "Rare-earth constituent in both CRESt reported recipes; public benchmark is Ce oxide, not alloyed Ce metal.", possible_synergy: "Possible electronic/interface/oxide effects require direct phase and oxidation-state evidence; do not infer oxide behavior for alloyed Ce.", fraction_effect_hypothesis: "May alter surface state, phase and morphology; sign on device power uncertain.", evidence: [E001, E002, E011], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Nb", order: 7, atomic_number: 41, standard_atomic_weight_u: 92.90637, catalytic_context: "Present at 10.6 at.% in reported power-focused recipe and 33.8 at.% in cost-normalized recipe; public USGS benchmark is ferroniobium.", possible_synergy: "May tune structure/electronic environment in multielement alloy; exact isolated mechanism not resolved.", fraction_effect_hypothesis: "Observed high recipe-to-recipe variation signals trade-off, not causal dose response; could change dilution, phase and active-site density.", evidence: [E001, E002, E012], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
  - {symbol: "Cr", order: 8, atomic_number: 24, standard_atomic_weight_u: 51.9961, catalytic_context: "Present at 8.2 at.% in reported cost-normalized CRESt composition; USGS reports metal and ferrochromium prices.", possible_synergy: "Possible phase, surface oxide/passivation and site-ensemble effects require direct characterization.", fraction_effect_hypothesis: "Could improve or impair activity/stability depending on state and conditions; no monotonic direction justified.", evidence: [E001, E002, E010], expert_status: "accepted_as_working_element_prior_not_causal_validation"}
indicators:
  - indicator_id: I01
    name: "Peak areal device power density"
    definition: "max_k(V_cell,k*I_k/A_geo), equivalently max(V_cell*j_geo), over declared device polarization conditions."
    unit: "W cm^-2_geo"
    conditions: ["device/cell/stack", "reaction and electrode role", "geometric active area", "fuel/oxidant/feed/flow", "temperature/pressure/humidity or electrolyte", "conditioning and polarization protocol"]
    domain_meaning: "Primary device-level outcome, jointly affected by catalyst and full electrode/device."
    audience: "shared"
    obtainable_by: ["measure", "derive", "estimate", "machine_learn"]
    optimization_role: "primary_objective"
    optimization_direction: "maximize"
    importance: 5
    computability: 4
    data_readiness: 2
    priority: "P1"
    methods: ["measure device polarization; derive V*I/A; optionally predict with condition-aware validated model"]
    related_indicators: [I02, I03, I04, I05, I06]
    threshold_guidance: "No universal absolute cutoff. Use expert-approved application minimum or matched benchmark-relative target; metric protocol is pending."
    evidence: [E001, E002, E013]
    expert_status: "core_objective_confirmed_unit_and_protocol_unconfirmed"
  - indicator_id: I02
    name: "PGM and precious-metal mass fractions"
    definition: "Convert atomic fractions to mass fractions w_i=x_i*M_i/sum_j(x_j*M_j); PGM=sum(Pd,Pt,Ir), broader precious set=sum(Pd,Pt,Ir,Au). Report separately."
    unit: "mass fraction or wt.%"
    conditions: ["atomic composition and CIAAW atomic-weight version", "declared PGM/precious category"]
    domain_meaning: "Material intensity of high-value metals; separate sets avoid classification ambiguity."
    audience: "shared"
    obtainable_by: ["derive"]
    optimization_role: "secondary_objective"
    optimization_direction: "minimize"
    importance: 4
    computability: 5
    data_readiness: 4
    priority: "P1"
    methods: ["derive from measured atomic composition and standard atomic weights"]
    related_indicators: [I01, I03, I04]
    threshold_guidance: "No universal threshold. Apply only expert-approved budget/cap or minimize subject to a power floor. CRESt's reported one-quarter loading is context-specific, not a general limit."
    evidence: [E001, E002, E006, E007, E014]
    expert_status: "accepted_as_cost_descriptor_threshold_unconfirmed"
  - indicator_id: I03
    name: "Composition-weighted public-price raw-material proxy"
    definition: "C_raw=sum_i(w_i*p_i), where p_i is timestamped price converted to USD/kg elemental-content basis and w_i is mass fraction. Flag nonmatching source forms; do not label as precursor or catalyst cost."
    unit: "USD kg^-1 alloy (proxy)"
    conditions: ["price year and source", "commodity form/purity/content basis", "unit/currency conversions", "measured or nominal composition"]
    domain_meaning: "Approximate comparative cost pressure from bulk commodity references."
    audience: "shared"
    obtainable_by: ["derive"]
    optimization_role: "secondary_objective"
    optimization_direction: "minimize"
    importance: 4
    computability: 4
    data_readiness: 2
    priority: "P1"
    methods: ["normalize public benchmark rows to same currency/unit/basis; calculate mass-weighted sum"]
    related_indicators: [I02, I04, I05]
    threshold_guidance: "No absolute threshold justified until sourcing region/scale/material forms chosen; use as proxy-ranked secondary metric or approved budget cap."
    evidence: [E007, E008, E009, E010, E011, E012]
    expert_status: "normalized_cost_selected_price_and_formula_unconfirmed"
  - indicator_id: I04
    name: "Actual precursor cost per synthesized alloy mass"
    definition: "Sum of precursor consumed mass times supplier unit price, corrected for elemental assay/stoichiometry, divided by recovered alloy mass; yield and recovery handled explicitly."
    unit: "USD kg^-1 synthesized alloy"
    conditions: ["vendor/quote date/region", "precursor form and purity", "batch yield", "recovery and scale"]
    domain_meaning: "Purchasable material-input cost, closer to laboratory/manufacturing formulation cost than commodity index."
