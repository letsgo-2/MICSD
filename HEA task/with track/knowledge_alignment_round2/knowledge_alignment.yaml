  - indicator_id: I08
    name: "Atomic-weighted elemental descriptor"
    definition: "For property d, calculate d_bar=sum_i(x_i*d_i) with declared units, source/version and composition basis; includes mean atomic weight, radius, electronegativity."
    unit: "property-specific"
    conditions: ["data source/version", "property definition", "atomic fraction vector"]
