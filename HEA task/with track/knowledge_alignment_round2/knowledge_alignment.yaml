    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - indicator_id: I09
    name: "Ideal configurational entropy descriptor"
    definition: "S_conf/R=-sum_i(x_i*ln(x_i)) for ideal random mixing; define 0*ln(0)=0."
    unit: "dimensionless S_conf/R"
    conditions: ["atomic fractions", "ideal random-mixing assumption"]
    domain_meaning: "Composition-derived feature; does not establish realized phase or activity."
