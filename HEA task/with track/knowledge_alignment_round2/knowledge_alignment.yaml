    optimization_role: "secondary_objective"
    optimization_direction: "minimize"
    importance: 4
    computability: 4
    data_readiness: 1
    priority: "P1"
    methods: ["procurement records and precursor stoichiometric costing"]
    related_indicators: [I01, I02, I03, I05]
    threshold_guidance: "Supplier/scale-specific budget only; absent quote data, not evaluable."
    evidence: [E015]
    expert_status: "cost_objective_accepted_procurement_data_unavailable"
  - indicator_id: I05
    name: "Cost-specific device power"
    definition: "A declared device power-density numerator divided by an explicitly defined catalyst/material cost denominator; proposed candidate `P_A,max/C_precursor` must not be conflated with CRESt paper metric before supplement verification."
    unit: "definition-dependent; e.g. W cm^-2 per USD kg^-1"
