  - {metric_id: M_NORMALIZED_COST, final_role: "diagnostic", rank: 5, ranking_basis: ["existing code computes it", "price source/vintage/unit undocumented and may not equal cost"], direction: "minimize", threshold: {value: null, status: "legacy config target values unapproved"}, evaluator_id: "calculate_normalized_cost in catalyst_al/costs.py", decision_status: "proposed; do not use as actual cost", evidence_refs: ["AL:catalyst_al/costs.py", "AL/config.json"]}
  - {metric_id: M_ELEMENT_BOUNDS, final_role: "deferred", rank: 4, ranking_basis: ["could be hard constraints but values/presence rule absent"], direction: "target_range", threshold: {value: null, status: "deferred pending domain approval"}, evaluator_id: "none until bounds set", decision_status: "deferred", evidence_refs: ["EA-KA:E001"]}
  - {metric_id: M_NOVELTY_DISTANCE, final_role: "diagnostic", rank: 6, ranking_basis: ["AL has CLR nearest-neighbor and AK-DAS diversity components", "representation/epsilon need migration check"], direction: "context_dependent", threshold: {value: null, status: "diagnostic only"}, evaluator_id: "find_similar_examples / AKDAS in catalyst_al/sampling.py", decision_status: "proposed", evidence_refs: ["AL:catalyst_al/sampling.py"]}
  - {metric_id: M_MODEL_CONFIDENCE, final_role: "diagnostic", rank: 3, ranking_basis: ["needed to manage risk", "current AL signals are not calibrated confidence"], direction: "context_dependent", threshold: {value: null, status: "blocked pending validation/calibration"}, evaluator_id: "LLM committee mean/std and GBR point predictor; neither calibrated as coded", decision_status: "proposed; not active gate yet", evidence_refs: ["AL:catalyst_al/providers.py", "AL:catalyst_al/model.py"]}
  - {metric_id: M_FORMULATION_STABILITY, final_role: "soft_constraint", rank: 7, ranking_basis: ["scientist requests stability of high-performing formulations", "requires independent replicates, absent from current workflow"], direction: "minimize", threshold: {value: null, status: "no replicate criterion supplied"}, evaluator_id: "future replicate evaluator; not implemented", decision_status: "proposed", evidence_refs: ["EA-KA:E001"]}
