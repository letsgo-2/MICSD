execution_context:
  goal: "Optimize peak device power density as the core performance metric while considering cost and formulation quality/stability."
  authorization: "NO EXECUTION AUTHORIZED; this artifact is a proposal only. Do not run training, candidate generation, scoring, LLM/API calls, or experiments without explicit user confirmation."
  target_device: null
  target_reaction: null
  confirmed_expert_decisions:
    core_performance_metric: "peak power density"
    composition_unit: "mass_fraction"
    fixed_composition_order: ["Pd", "Pt", "Au", "Cr", "Ir", "Ce", "Cu", "Nb"]
    composition_constraints: ["all fractions finite and nonnegative", "sum of eight mass fractions equals one"]
  composition_migration:
    source_order_in_al: ["Pd", "Pt", "Cu", "Au", "Ir", "Ce", "Nb", "Cr"]
    target_order: ["Pd", "Pt", "Au", "Cr", "Ir", "Ce", "Cu", "Nb"]
    source_fraction_basis: "unknown/unverified per table until source provenance checked"
    rule: "Map by column header; preserve original vector and basis. Convert to mass fraction only if source is verified atomic fraction, using an explicitly versioned atomic-weight table. Never relabel or silently normalize."
    closure_tolerance: null
    per_element_bounds: null
    all_elements_must_be_positive: null
  execution_state: "proposal_only"
  no_run_evidence: "No AL script, model training, model inference, API call, candidate generation, or physical experiment was run in Round 2."
