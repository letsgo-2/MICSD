metric_candidates:
  - metric_id: M_COMP_VALID
    name: "Composition validity"
    aliases: ["mass-fraction feasibility", "simplex validity"]
    definition: "For w in order [Pd,Pt,Au,Cr,Ir,Ce,Cu,Nb], each value is finite and >=0; sum(w)=1 within a tolerance fixed from validated measurement/reporting precision."
    proposed_roles: ["hard_constraint"]
    direction: "target_range"
    threshold: {component_min: 0.0, component_max: null, sum: 1.0, tolerance: null, unit: "mass fraction", status: "expert-approved rules; tolerance pending"}
    conditions: ["canonical mass basis", "target header order", "nominal vs measured distinction"]
    acquisition: ["rule-based validator before all prediction/screening"]
    evidence_refs: ["USER:computer-expert-round2", "USER:materials-expert-round2"]
    expert_status: "approved"
    unresolved_fields: ["numeric closure tolerance", "per-element bounds", "zero/presence policy"]
  - metric_id: M_POWER
    name: "Peak areal device power density"
    aliases: ["peak power density", "maximum power density"]
    definition: "max_k(V_cell,k*I_k/A_geo) or max(V_cell*j_geo) from target-device polarization curve."
    unit: "mW cm^-2_geo or W cm^-2_geo; choose one canonical storage unit"
    proposed_roles: ["primary_objective"]
    direction: "maximize"
    threshold: {value: null, range: [], unit: "device-specific", status: "unresolved; do not inherit CRESt number as universal target"}
    conditions: ["device/reaction/electrode role", "area basis", "fuel/electrolyte/feed", "catalyst loading", "temperature/pressure/flow", "conditioning and polarization protocol"]
    acquisition: ["AL virtual predictor outputs are separate from physical measurement; direct device evaluator/interface still required"]
    evidence_refs: ["EA-KA:E001", "EA-KA:E002", "WEB:CREST2025", "WEB:FCTESQA2010"]
    expert_status: "core_objective_confirmed_unit_and_protocol_unconfirmed"
    unresolved_fields: ["target device and reaction", "unit/area basis", "measurement protocol", "acceptance threshold/uncertainty"]
  - metric_id: M_NORMALIZED_COST
    name: "Normalized cost proxy"
    aliases: ["legacy normalized cost", "cost relative to pure Pd"]
    definition: "AL implementation computes dot(composition, hard-coded METAL_PRICES)/Pd_price*100. The code does not document price units/vintage. This is a legacy relative proxy, not actual precursor cost."
    proposed_roles: ["diagnostic", "secondary_objective only after approval"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "legacy relative cost index", status: "unresolved; code's target values are unapproved"}
    conditions: ["old AL element order", "embedded price vector", "unit/vintage/source not in code"]
    acquisition: ["existing catalyst_al/costs.py function calculate_normalized_cost"]
    evidence_refs: ["AL:catalyst_al/costs.py", "AL:README.md", "EA-KA:E015"]
    expert_status: "cost_proxy_selected_price_and_formula_unconfirmed"
    unresolved_fields: ["source prices and units", "actual cost relation", "target cost cap", "double-counting with cost metric"]
  - metric_id: M_ELEMENT_BOUNDS
    name: "Element-content bounds/presence"
    aliases: ["component feasibility region"]
    definition: "Optional per-element lower/upper mass-fraction limits and optional all-eight-positive policy."
    proposed_roles: ["hard_constraint after approval"]
    direction: "target_range"
    threshold: {per_element_min: null, per_element_max: null, unit: "mass fraction", status: "unresolved"}
    conditions: ["synthesis feasibility", "assay LOQ", "project definition of eight-component material"]
    acquisition: ["expert-provided schema and process feasibility review"]
    evidence_refs: ["EA-KA:E001", "EA-KA:E002"]
    expert_status: "constraint_role_confirmed_numeric_bounds_and_presence_unconfirmed"
    unresolved_fields: ["all-positive rule", "LOQ", "component bounds"]
  - metric_id: M_NOVELTY_DISTANCE
    name: "Distance from candidate to existing measured samples"
    aliases: ["composition novelty", "nearest measured-neighbor distance"]
    definition: "Minimum declared composition-space distance between candidate and eligible measured samples after correct mass-order migration. Current AL uses CLR(log-ratio) with epsilon 1e-6 and Euclidean norm; candidate library diversity uses AK-DAS Gaussian-kernel relevance/diversity."
    proposed_roles: ["diagnostic", "batch-diversity signal"]
    direction: "context_dependent"
    threshold: {value: null, range: [], unit: "distance in declared transformed space", status: "no universal novelty cutoff"}
    conditions: ["measured-only reference pool preferred", "representation and zero handling fixed", "exclude non-comparable protocols or stratify them"]
    acquisition: ["existing find_similar_examples and AKDAS after schema adapter; output is not implemented as an explicit screening field today"]
    evidence_refs: ["AL:catalyst_al/sampling.py", "AL:catalyst_al/pipeline.py"]
    expert_status: "diagnostic_requested_distance_definition_unconfirmed"
    unresolved_fields: ["distance interpretation after mass-basis migration", "epsilon/zero policy", "measured vs predicted reference pool"]
  - metric_id: M_MODEL_CONFIDENCE
    name: "Model prediction confidence/uncertainty"
    aliases: ["uncertainty", "confidence status"]
    definition: "Current GBR oracle returns point prediction only. Current LLM committee produces repeated-prompt mean/std, which is prompt dispersion and not calibrated predictive confidence."
    proposed_roles: ["screening gate", "diagnostic"]
    direction: "context_dependent"
    threshold: {value: null, range: [], unit: "calibrated interval/dispersion metric", status: "not defined/calibrated"}
    conditions: ["validated held-out data", "applicability-domain flag", "distinguish GBR/LLM/model/measurement uncertainty"]
    acquisition: ["AL pipeline computes LLM committee mean/std; current GBR has no uncertainty API"]
    evidence_refs: ["AL:catalyst_al/model.py", "AL:catalyst_al/providers.py", "AL:catalyst_al/pipeline.py"]
    expert_status: "diagnostic_requested_calibration_unconfirmed"
    unresolved_fields: ["calibration method/criteria", "allowed risk for selection", "how to act on OOD candidates"]
  - metric_id: M_FORMULATION_STABILITY
    name: "High-performance formulation stability/reproducibility"
    aliases: ["recipe robustness", "high-performing formulation stability"]
    definition: "Variation of measured device power across independent synthesis/device replicates for the same mass recipe under a locked protocol; separate from long-term electrochemical durability."
    proposed_roles: ["soft_constraint", "diagnostic", "possible secondary objective"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "replicate SD/CV or interval width", status: "no replicate protocol or threshold supplied"}
    conditions: ["independent batches/devices", "identical nominal recipe/process/device test", "measurement uncertainty separated from batch variation"]
    acquisition: ["requires new/reconciled replicate measurements; cannot derive from a single recipe score"]
    evidence_refs: ["EA-KA:E001", "EA-KA:E002", "WEB:FCTESQA2010"]
    expert_status: "diagnostic_requested_stability_definition_unconfirmed"
    unresolved_fields: ["replicate count", "robustness statistic", "acceptance threshold", "distinguish durability lifetime"]
  - metric_id: M_ACTUAL_COST
    name: "Actual material/precursor cost"
    aliases: ["actual cost", "bill of materials"]
    definition: "Quote- and mass-balance-derived material cost at specified precursor grade, yield, scale, date and currency; distinct from legacy normalized cost."
    proposed_roles: ["secondary_objective", "hard budget constraint if specified"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "currency per declared mass/batch basis", status: "missing quote data and budget"}
    conditions: ["precursor form/purity", "yield/recovery", "region/date/scale", "denominator"]
    acquisition: ["no direct implementation in inspected AL package"]
    evidence_refs: ["EA-KA:E015"]
    expert_status: "cost_objective_accepted_procurement_data_unavailable"
    unresolved_fields: ["price inputs", "cost basis", "budget/cost requirement"]
metric_decisions:
