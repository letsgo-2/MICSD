      research, design a basic task-execution workflow for optimizing the formulation of an eight-component high-entropy
      alloy catalyst. Provide necessary recommendations, especially recommendations for metric ranking and corresponding
      threshold guidance, preferably supported by evidence. Starting from existing experimental data, the workflow should
      explain how to perform data organization, model training, candidate-composition generation, performance evaluation,
      candidate screening, and result feedback, but it must not assume a specific model or algorithm that has not yet
      been confirmed. The materials expert provides the following information: the catalyst consists of eight metals—Pd,
      Pt, Au, Cr, Ir, Ce, Cu, and Nb—and is generally represented as a mass-fraction vector with a fixed element order;
      each element''s mass fraction must be nonnegative, and the fractions must sum to 1. The optimization problem therefore
      involves trade-offs among peak power density, cost, and composition constraints. The computer expert would like
      to construct a model workflow capable of iterative optimization from existing composition-performance data. Add
      the suffix `round1` to the output filenames.'
  - id: EO2
