schema_version: "scientific-knowledge-alignment/0.2.0"
project:
  name: "Round 1: eight-component HEA electrocatalyst composition alignment"
  goal: "Optimize elemental composition of an eight-component high-entropy-alloy catalyst to increase electrochemical-device peak power density."
  domain: "High-entropy alloy electrocatalysis and electrochemical device performance"
  application_context: "Electrochemical device not yet specified"
  web_search_allowed: true
  primary_evidence_directory: "../literature_markdown/"
  evidence_file_count: 43
  expert_request: "Extract concepts, metrics, constraints, conditions, and structure-performance relations; keep uncertain claims in expert review."
  status: "general_knowledge_accepted_itemwise_validation_not_recorded"
  scope_note: "All 43 Markdown files are inventoried below. Only directly relevant electrocatalyst studies support reaction-specific activity claims; method papers and unrelated material systems are contextual, not direct performance evidence."
concepts:
  - concept_id: C001
    name: "High-entropy alloy"
    definition: "Compositionally complex alloy often defined either by at least five principal elements with commonly cited atomic-fraction bounds or by an ideal configurational entropy criterion; definitions vary and neither alone requires a single phase."
    synonyms: ["HEA", "high-entropy alloy", "compositionally complex alloy (overlapping broader term)"]
    parent_concept: "Alloy"
    ontology_source:
      name: "Local concept aligned to peer-reviewed HEA literature; no authoritative ontology IRI identified"
      iri_or_url: "https://doi.org/10.1016/j.actamat.2016.08.081"
      version_or_access_date: "Accessed 2026-10-27"
    mapping_status: "close"
    evidence: [E002, E003, E007, E008, E013]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C002
    name: "Eight-component alloy"
    definition: "Project-defined catalyst alloy containing exactly eight designated elemental components; does not imply equiatomic composition, a single phase, or minimum fractions."
    synonyms: ["eight-element alloy"]
    parent_concept: "High-entropy alloy (project scope; definition to confirm)"
    ontology_source: {name: "Project-local", iri_or_url: "", version_or_access_date: "2026-10-27"}
    mapping_status: "local"
    evidence: [E001]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C003
    name: "Composition vector"
    definition: "Fractions x_i for component i, with x_i >= 0 and sum_i x_i = 1; atom fractions and mass fractions are distinct representations."
    synonyms: ["compositional data", "mixture composition"]
    parent_concept: "Composition"
    ontology_source:
      name: "Compositional data analysis literature"
      iri_or_url: "https://doi.org/10.1111/j.2517-6161.1982.tb01195.x"
      version_or_access_date: "Accessed 2026-10-27"
    mapping_status: "close"
    evidence: [E033, E034]
    expert_status: "pending"
  - concept_id: C004
    name: "Electrocatalyst"
    definition: "A catalyst operating at an electrode to affect an electrochemical reaction rate; meaning is conditional on reaction, electrolyte, potential scale, electrode, and protocol."
    synonyms: ["electrochemical catalyst"]
    parent_concept: "Catalyst"
    ontology_source:
      name: "IUPAC Gold Book, electrocatalysis (09094); catalyst (C00876)"
      iri_or_url: "https://doi.org/10.1351/goldbook.09094; https://doi.org/10.1351/goldbook.C00876"
      version_or_access_date: "Gold Book 5.0.0; accessed 2026-10-27"
    mapping_status: "close"
    evidence: [E007, E008, E013, E021, E024]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C005
    name: "Mean current density"
    definition: "Electric current divided by a stated electrode area; geometric/projected and true/electrochemically active area bases must not be conflated."
    synonyms: ["current density", "j"]
    parent_concept: "Electric current per area"
    ontology_source:
      name: "IUPAC Gold Book, M03776"
      iri_or_url: "https://doi.org/10.1351/goldbook.M03776"
      version_or_access_date: "Gold Book 5.0.0; accessed 2026-10-27"
    mapping_status: "exact"
    evidence: [E044]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C009
    name: "Overpotential"
    definition: "Deviation of an electrode potential from its equilibrium value required to cause a given current to flow through the electrode."
    synonyms: ["eta", "electrode overpotential"]
    parent_concept: "Electrode potential difference"
    ontology_source:
      name: "IUPAC Gold Book, O04358"
      iri_or_url: "https://doi.org/10.1351/goldbook.O04358"
      version_or_access_date: "Gold Book 5.0.0; accessed 2026-10-27"
    mapping_status: "exact"
    evidence: [E047]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C006
    name: "Areal peak device power density"
    definition: "Maximum cell power divided by declared active area over a defined device polarization curve; for each point p_A = V_cell * I / A. Device-level response, not an intrinsic catalyst-only property."
    synonyms: ["peak power density", "maximum areal power density"]
    parent_concept: "Device performance metric"
    ontology_source:
      name: "Local project concept; IUPAC electrochemical engineering nomenclature and FCTESQA PEFC procedure are terminology/method references"
      iri_or_url: "https://doi.org/10.1351/pac199365051009"
      version_or_access_date: "Accessed 2026-10-27"
    mapping_status: "local"
    evidence: [E045, E046]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C007
    name: "Polarization curve"
    definition: "Device voltage and power characterized as functions of current density under declared, controlled operating conditions; the supplied FCTESQA procedure is specifically for PEFC single cells."
    synonyms: ["current-voltage curve", "polarisation curve"]
    parent_concept: "Electrochemical device characterization"
    ontology_source:
      name: "FCTESQA PEFC SC 5-2 test module (harmonized procedure; not represented as formal standard)"
      iri_or_url: "https://joint-research-centre.ec.europa.eu/system/files/2017-02/polarisation_curve_testprocedure.pdf"
      version_or_access_date: "Version 2010-04-30; accessed 2026-10-27"
    mapping_status: "close"
    evidence: [E045, E046]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C008
    name: "Chemical ordering and phase state"
    definition: "Arrangement of elements among lattice sites and phases, including ordered intermetallic, disordered solid solution, and multiphase states; surface state may differ from bulk composition."
    synonyms: ["ordering degree", "phase constitution", "surface segregation"]
    parent_concept: "Alloy structure"
    ontology_source: {name: "Project-local mapping based on alloy/electrocatalysis literature", iri_or_url: "", version_or_access_date: "2026-10-27"}
    mapping_status: "local"
    evidence: [E006, E021, E025]
    expert_status: "accepted_in_principle_from_dialogue"
