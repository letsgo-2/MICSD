metric_candidates:
  - metric_id: M_POWER
    name: "Peak areal device power density"
    aliases: ["maximum power density", "peak power density"]
    definition: "max_k(V_cell,k*I_k/A_geo) or max(V_cell*j_geo) from a device polarization curve."
    unit: "mW cm^-2_geo or W cm^-2_geo; select one canonical storage unit"
    proposed_roles: ["primary_objective"]
    direction: "maximize"
    threshold: {value: null, range: [], unit: "mW cm^-2_geo", status: "unresolved"}
    suggested_reference_context: "CRESt DFFC: 325 mW cm^-2 at 60 C, 2.0 M KOH + 1.0 M HCOOK, total metal loading 2.0 mg cm^-2; comparator/context only if exact target protocol matches."
    conditions: ["device/reaction/electrode role", "area basis", "fuel/electrolyte/feed", "loading", "temperature/pressure/flow", "conditioning", "polarization protocol"]
    acquisition: ["measure full device curve", "derive V*I/A", "predict only after condition-aware model validation"]
    evidence_refs: ["EA-KA:E001", "EA-KA:E002", "WEB:CREST2025", "WEB:FCTESQA2010"]
    expert_status: "core_objective_confirmed_unit_and_protocol_unconfirmed"
    unresolved_fields: ["target device", "reaction", "conditions", "replicate/uncertainty criterion", "application minimum"]
  - metric_id: M_COST
    name: "Actual precursor/material cost"
    aliases: ["bill of materials cost", "formulation cost"]
    definition: "Cost from actual precursor quantities, prices, purity/stoichiometry, yield and scale, reported per catalyst/electrode/batch as agreed."
    proposed_roles: ["secondary_objective", "hard_constraint if budget supplied"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "currency per defined basis", status: "unresolved"}
    conditions: ["supplier", "region/date/currency", "purity/form", "yield/recovery", "batch scale", "cost denominator"]
    acquisition: ["derive from purchase records and synthesis mass balance"]
    evidence_refs: ["EA-KA:E015", "EA-KA:E001"]
    expert_status: "cost_objective_accepted_procurement_data_unavailable"
    unresolved_fields: ["quotes and cost basis", "budget or no-hard-cap decision"]
  - metric_id: M_COMPOSITION
    name: "Eight mass-fraction components"
    aliases: ["formulation vector", "composition feasibility"]
    definition: "w=[w_Pd,w_Pt,w_Au,w_Cr,w_Ir,w_Ce,w_Cu,w_Nb] with w_i>=0 and sum=1."
    proposed_roles: ["hard_constraint", "design_variables"]
    direction: "target_range"
    threshold: {value: 1.0, range: [1.0, 1.0], unit: "sum of mass fractions", status: "expert_provided; numeric tolerance pending"}
    conditions: ["verified mass-fraction basis", "fixed header order", "assay/tolerance", "presence policy"]
    acquisition: ["specify nominal mass recipe", "measure elemental composition for realized recipe"]
    evidence_refs: ["USER:materials-expert-round1", "EA-KA:E003"]
    expert_status: "approved_for_representation_only"
    unresolved_fields: ["element bounds", "all-positive policy", "closure tolerance", "source-data conversion" ]
  - metric_id: M_PGM
    name: "PGM/broader precious-metal loading"
    aliases: ["precious-metal fraction", "PGM loading"]
    definition: "Report mass fractions Pd+Pt+Ir and separately Pd+Pt+Ir+Au; additionally report metal loading mg cm^-2 if device relevance."
    proposed_roles: ["secondary_objective", "diagnostic", "soft budget criterion"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "mass fraction or mg cm^-2", status: "unresolved"}
    conditions: ["category definition", "catalyst or electrode/device denominator"]
    acquisition: ["derive from verified mass vector", "measure total/PGM loading"]
    evidence_refs: ["EA-KA:E006", "EA-KA:E001"]
    expert_status: "precious_metal_cost_descriptor_accepted_threshold_unconfirmed"
    unresolved_fields: ["include Au in project precious set?", "loading denominator", "cost redundancy"]
  - metric_id: M_COST_PROXY
    name: "Public-price raw-material index"
    aliases: ["composition cost proxy"]
    definition: "Composition-weighted public commodity price using a consistent source vintage and transparent material-form conversions."
    proposed_roles: ["diagnostic", "provisional secondary objective"]
    direction: "minimize"
    threshold: {value: null, range: [], unit: "USD kg^-1 proxy", status: "no hard threshold supported"}
    conditions: ["price year", "product form/purity", "basis conversion", "currency"]
    acquisition: ["derive from approved USGS price table; do not use as supplier cost"]
    evidence_refs: ["EA-KA:E006", "EA-KA:E007", "EA-KA:E008", "EA-KA:E009", "EA-KA:E010", "EA-KA:E011"]
    expert_status: "cost_proxy_selected_price_and_formula_unconfirmed"
    unresolved_fields: ["approve dataset and forms", "do not double-count against actual cost"]
  - metric_id: M_HALF_CELL
    name: "Formate half-cell activity/overpotential"
    aliases: ["LSV current density", "electrode activity proxy"]
    definition: "Reaction-specific half-cell current or overpotential at fixed conditions; proxy only if validated against device performance for the same context."
    proposed_roles: ["intermediate", "diagnostic"]
    direction: "context_dependent"
    threshold: {value: null, range: [], unit: "protocol-specific", status: "unresolved"}
    conditions: ["electrolyte/concentration", "potential scale", "loading", "iR correction", "scan/hold protocol"]
    acquisition: ["measure half-cell; do not substitute for device power"]
    evidence_refs: ["EA-KA:E001", "EA-KA:E002"]
    expert_status: "accepted_as_supporting_proxy_not_device_target"
    unresolved_fields: ["target reaction and protocol", "proxy calibration"]
