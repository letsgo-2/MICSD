  - {metric_id: M_HALF_CELL, final_role: "intermediate", rank: 4, ranking_basis: ["may reduce experimental cost but is not endpoint", "CRESt proxy assumptions are context-specific"], direction: "context_dependent", threshold: {value: null, status: "unresolved"}, evaluator_id: "IF-HALFCELL-001", decision_status: "proposed", evidence_refs: ["EA-KA:E001"]}
