indicators:
  - indicator_id: I001
    name: Peak / maximum power density
    definition: "Maximum fuel-cell power density or expert-approved proxy ranking from current-potential data."
    unit: "W cm^-2_geo in paper figure; local CSV unit pending"
    conditions: [direct formate fuel-cell protocol, proxy protocol must be flagged]
    audience: shared
    obtainable_by: [measure, machine_learn]
    optimization_role: primary_objective
    optimization_direction: maximize
    importance: 5
    computability: 4
    data_readiness: 4
    priority: P0
    calculation_method: "Measured from polarization curve; local model target column is power_density."
    reasonable_range_round2: "Local virtual-oracle sample: 0.02709 to 75.45; use unit only after expert certification."
    data_source: [primary_paper, local_csv]
    expert_status: "core_objective_confirmed_unit_and_protocol_unconfirmed"
  - indicator_id: I002
    name: Cost-specific performance
    definition: "Power density normalized by catalyst material cost."
    unit: relative or normalized index
    conditions: [certified cost formula, benchmark specified]
    audience: shared
    obtainable_by: [derive, machine_learn]
    optimization_role: secondary_objective
    optimization_direction: maximize
    importance: 5
    computability: 4
    data_readiness: 3
    priority: P0
    calculation_method: "power_density / catalyst_cost_index or paper-certified cost-normalized metric."
    reasonable_range_round2: "Target should exceed pure Pd benchmark; primary paper reports 9.3x cost-specific improvement."
    data_source: [primary_paper, local_cost_formula]
    expert_status: "cost_performance_role_accepted_exact_formula_unconfirmed"
  - indicator_id: I003
    name: Normalized catalyst cost
    definition: "Local weighted cost index normalized to Pd price times 100."
    unit: dimensionless index
    conditions: [fixed price table, normalized composition]
    audience: computer_expert
    obtainable_by: [derive]
    optimization_role: constraint
    optimization_direction: minimize
    importance: 4
    computability: 5
    data_readiness: 3
    priority: P1
    calculation_method: "dot([Pd,Pt,Cu,Au,Ir,Ce,Nb,Cr], [26393,20325,4.53,29298,23926,5.37,32.22,5.86]) / 26393 * 100"
    reasonable_range_round2: "Use pure Pd = 100 as local reference; impose upper bound only after cost expert certification."
    data_source: [local_costs_py, USGS_cost_context]
    expert_status: "normalized_cost_selected_price_and_formula_unconfirmed"
  - indicator_id: I015
    name: Precious-metal fraction
    definition: "Sum of Pd, Pt, Au, and Ir fractions."
    unit: fraction
    conditions: [normalized composition]
    audience: computer_expert
    obtainable_by: [derive]
    optimization_role: constraint
    optimization_direction: minimize subject to performance
    importance: 4
    computability: 5
    data_readiness: 5
    priority: P1
    calculation_method: "Pd + Pt + Au + Ir"
    reasonable_range_round2: "Local top-10 mean about 0.7296; paper cost-specific recipe about 0.505. Treat as soft cost lever, not hard threshold."
    data_source: [local_csv_audit, primary_paper]
    expert_status: "accepted_as_cost_descriptor_threshold_unconfirmed"
  - indicator_id: I017
    name: Low-cost modifier fraction
    definition: "Sum of Cu, Ce, Nb, and Cr fractions."
    unit: fraction
    conditions: [normalized composition]
    audience: computer_expert
    obtainable_by: [derive]
    optimization_role: diagnostic
    optimization_direction: context_dependent
    importance: 3
    computability: 5
    data_readiness: 5
    priority: P2
    calculation_method: "Cu + Ce + Nb + Cr"
    reasonable_range_round2: "Local top-10 mean about 0.2704; paper cost-specific recipe about 0.515."
    data_source: [local_csv_audit, primary_paper]
    expert_status: "accepted_as_cost_descriptor_threshold_unconfirmed"
  - indicator_id: I018
    name: Simplex validity
    definition: "Whether a candidate is finite, non-negative, length 8, and sums to 1."
    unit: boolean
    conditions: [candidate generation, data ingestion]
    audience: computer_expert
    obtainable_by: [derive]
    optimization_role: constraint
    optimization_direction: target_range
    importance: 5
    computability: 5
    data_readiness: 5
    priority: P0
    calculation_method: "len(x)=8 and all finite and all x_i >= 0 and abs(sum(x)-1)<=tolerance."
    reasonable_range_round2: "Tolerance <= 1e-6 after normalization; raw rows may be normalized if sum > 0."
    data_source: [local_data_py, local_costs_py]
    expert_status: approved_for_computer_representation
  - indicator_id: I019
    name: Element-wise synthesis bounds validity
    definition: "Whether every element fraction lies inside expert-certified synthesis bounds."
    unit: boolean
    conditions: [robotic synthesis or constrained candidate generation]
    audience: computer_expert
    obtainable_by: [derive, expert_only]
    optimization_role: constraint
    optimization_direction: target_range
    importance: 5
    computability: 4
    data_readiness: 2
    priority: P1
    calculation_method: "lower_i <= x_i <= upper_i for each element."
    reasonable_range_round2: "Provisional computational range 0 to 1 for each element; experimental bounds pending."
    data_source: [local_code, expert_review_needed]
    expert_status: "composition_constraint_selected_numeric_bounds_or_presence_unconfirmed"
  - indicator_id: I020
    name: UCB acquisition score
    definition: "Candidate screening score using predicted mean plus exploration-weighted uncertainty."
    unit: model score
    conditions: [within-batch ranking only]
    audience: computer_expert
    obtainable_by: [machine_learn]
    optimization_role: diagnostic
    optimization_direction: maximize
    importance: 3
    computability: 5
    data_readiness: 4
    priority: P2
    calculation_method: "llm_mean + ucb_exploration_weight * llm_std; local config weight = 1.0."
    reasonable_range_round2: "Relative within candidate batch, not globally calibrated."
    data_source: [local_pipeline_py, local_config_json]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - indicator_id: I021
    name: Final retained score
    definition: "Batch-local selection score balancing normalized power and normalized cost."
    unit: model score
    conditions: [queried batch only]
    audience: computer_expert
    obtainable_by: [derive]
    optimization_role: diagnostic
    optimization_direction: maximize
    importance: 3
    computability: 5
    data_readiness: 4
    priority: P2
    calculation_method: "performance_weight * normalized_power - (1-performance_weight) * normalized_cost; local performance_weight = 0.6."
    reasonable_range_round2: "Relative within queried batch."
    data_source: [local_pipeline_py, local_config_json]
    expert_status: "accepted_as_working_knowledge_from_dialogue"

data_contract:
  canonical_element_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
  numeric_format: float64
  canonical_input_columns: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
  supervised_training_columns: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr, power_density]
  optional_evaluation_columns: [normalized_cost, precious_metal_fraction, low_cost_modifier_fraction, llm_mean, llm_std, ucb_score, final_score]
  hard_constraints:
    - all_values_finite
    - all_values_non_negative
    - sum_equals_1
    - row_length_equals_8
  provisional_bounds:
    Pd: [0.0, 1.0]
    Pt: [0.0, 1.0]
    Cu: [0.0, 1.0]
    Au: [0.0, 1.0]
    Ir: [0.0, 1.0]
    Ce: [0.0, 1.0]
    Nb: [0.0, 1.0]
    Cr: [0.0, 1.0]
  local_dataset_audit:
    initial_examples:
      rows: 10
      power_density_min: 0.545
      power_density_max: 39.61
    oracle_training_sample:
      rows: 120
      power_density_min: 0.02709
      power_density_max: 75.45
      top_row:
        Pd: 0.486513
        Pt: 0.184815
        Cu: 0.017982
        Au: 0.0
        Ir: 0.036963
        Ce: 0.105894
        Nb: 0.167832
        Cr: 0.0
        power_density: 75.45
      top10_mean_composition:
        Pd: 0.484445
        Pt: 0.190515
        Cu: 0.0170066
        Au: 0.0255
        Ir: 0.0290984
        Ce: 0.105816
        Nb: 0.147619
        Cr: 0.0
  output_files_from_local_pipeline:
    - total_pool.csv
    - iteration_log.csv
    - query_log.csv
    - generated_ratios.csv
  non_merge_rules:
    - "Do not merge three-electrode potential with fuel-cell voltage without explicit mapping."
    - "Do not treat virtual-oracle or LLM predictions as experimental measurements."
    - "Do not treat simple composition correlations as causal element-content effects."

