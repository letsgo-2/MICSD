project:
  round: round2
  output_language: English
  project_goal: "Optimize elemental ratios of an eight-component Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr high-entropy alloy electrocatalyst to improve peak power density while considering noble-metal material cost."
  domain: "High-entropy alloy electrocatalysts for formate oxidation / direct formate fuel-cell performance."
  round2_update_reason: "Domain experts confirmed Round 1 base knowledge and requested element role/synergy supplementation; computer experts requested clearer data representation, optimization indicators, constraints, calculation methods, ranges, and input/output forms."
  primary_evidence:
    - E001-R2
  supporting_evidence:
    - E002-R2
    - E003-R2
    - E004-R2
    - E005-R2
    - E006-R2

concepts:
  - concept_id: C001
    name: Octonary Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr electrocatalyst
    definition: "Eight-element alloy catalyst composition space used for formate oxidation performance optimization."
    synonyms: [octonary catalyst, HEA-8D, eight-component HEA catalyst]
    parent_concept: high-entropy alloy electrocatalyst
    ontology_source:
      name: project local concept grounded in Zhang et al. 2025
      iri_or_url: https://doi.org/10.1038/s41586-025-09640-5
      version_or_access_date: 2026-07-30
    mapping_status: local
    evidence: [E001-R2]
    expert_status: "design_object_or_objective_roles_confirmed_details_unverified"
  - concept_id: C006
    name: Eight-element composition vector
    definition: "Fixed-order numeric vector [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr] with finite non-negative fractions normalized to sum to 1."
    synonyms: [composition vector, elemental ratio vector, catalyst_ratio]
    parent_concept: compositional data
    ontology_source:
      name: local AL code and CSV schema
      iri_or_url: AL/catalyst_active_learning_runnable/catalyst_al/costs.py
      version_or_access_date: 2026-07-30
    mapping_status: local
    evidence: [E002-R2]
    expert_status: approved_for_computer_representation
  - concept_id: C011
    name: Element role profile
    definition: "Round 2 per-element knowledge object recording catalytic role, possible synergy, cost role, and plausible content-effect direction."
    synonyms: [element contribution profile, metal role profile]
    parent_concept: catalyst design knowledge
    ontology_source:
      name: project local concept
      iri_or_url: null
      version_or_access_date: 2026-07-30
    mapping_status: local
    evidence: [E001-R2, E003-R2, E004-R2]
    expert_status: "accepted_as_working_knowledge_from_dialogue"
  - concept_id: C012
    name: Formula-design objective system
    definition: "Separation of primary performance objective, secondary cost-specific objective, cost constraints, and composition feasibility constraints in catalyst formulation optimization."
    synonyms: [optimization objective system]
    parent_concept: optimization task definition
    ontology_source:
      name: project local concept
      iri_or_url: null
      version_or_access_date: 2026-07-30
    mapping_status: local
    evidence: [E001-R2, E002-R2]
    expert_status: "design_object_or_objective_roles_confirmed_details_unverified"
  - concept_id: C013
