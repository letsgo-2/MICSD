registered_metrics:
  - metric_id: PE-R1-M001
    name: Peak power density
    aliases: [power_density, peak_power_density]
    direction: maximize
    unit: local_power_density_unit_pending
    value_type_boundary: measured_virtual_or_predicted_must_be_separated
  - metric_id: PE-R1-M002
    name: Composition validity
    aliases: [simplex_validity, ratio_validity]
    direction: target_range
    unit: mass_fraction_vector
    value_type_boundary: computed_constraint_check
  - metric_id: PE-R1-M003
    name: Normalized cost
    aliases: [normalized_cost]
    direction: minimize
    unit: Pd_normalized_index
    value_type_boundary: computed_implementation_metric
  - metric_id: PE-R1-M004
    name: Performance-cost Pareto status
    aliases: [pareto_front, nondominated_set]
    direction: derived_tradeoff
    unit: boolean_membership
    value_type_boundary: derived_analysis_metric
  - metric_id: PE-R1-M005
    name: Candidate novelty distance
    aliases: [clr_distance, aitchison_distance]
    direction: diagnose
    unit: clr_euclidean_distance
    value_type_boundary: derived_analysis_metric
  - metric_id: PE-R1-M006
    name: Prediction credibility
    aliases: [llm_mean, llm_std, ucb_score]
    direction: diagnose
    unit: model_output_units
    value_type_boundary: predicted_or_implementation_score_only

