metadata:
  title: "Execution orchestration: HEA formulation optimization with AL implementation"
  round: 2
  language: English
  status: proposed_paused
  created_date: "2026-10-27"
  approval_status: "core_metric_and_constraints_confirmed_procedure_requires_authorization"
  execution_performed: false
  upstream: "../execution_orchestration_round1/"
  implementation_root: "../AL/catalyst_active_learning_runnable/"
  design_principle: "Use implemented AL interfaces as inspected; do not execute until explicitly authorized."
execution_context:
  goal: "Maximize device peak power density for eight-metal catalyst formulation; use other metrics as constraints, trade-off views, or diagnostics as approved."
  composition_contract:
    project_order: [Pd, Pt, Au, Cr, Ir, Ce, Cu, Nb]
    project_basis: mass_fraction
    hard_constraints: ["all x_i >= 0", "sum(x_i) = 1", "fixed named order"]
    upstream_AL_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
    conflict_status: blocking
    handling: "Named-element adapter required; preserve raw data and reject invalid inputs. No positional pass-through and no silent normalization."
  execution_status: "Not run; no API, model, training, inference, candidate generation, tests, or environment-check command invoked."
  conditions: {device_protocol: null, power_density_unit: null, fraction_assay_basis: null}
implementation_inventory:
  - {component_id: AL-ENTRY, type: entrypoint, path: "AL/catalyst_active_learning_runnable/run.py", interface: "--config, --iterations, --candidate-pool-size, --output-dir", behavior: "Loads config, validates, invokes pipeline; can call live API and auto-train if oracle artifact missing.", status: inspected_not_run}
  - {component_id: AL-PIPELINE, type: pipeline, path: "AL/catalyst_active_learning_runnable/catalyst_al/pipeline.py", interface: "CatalystActiveLearningPipeline(config, provider=None).run()", behavior: "LLM recipe -> Dirichlet pool -> AK-DAS -> LLM committee -> Pareto selection -> GBR virtual oracle -> weighted retention -> CSV/JSON outputs.", status: inspected_not_run}
  - {component_id: AL-LLM, type: provider, path: "AL/catalyst_active_learning_runnable/catalyst_al/providers.py", interface: "DesignProvider.generate_ratio(target_pd,target_cost,references); predict_committee(ratio,similar_examples,size)", behavior: "OpenAI-compatible chat completions; model, key, base URL via environment; temperature 0.2; generated fractions normalized; committee values constrained to [0,500].", status: live_external_dependency_not_authorized}
  - {component_id: AL-ORACLE, type: predictor, path: "AL/catalyst_active_learning_runnable/catalyst_al/model.py", interface: "train_oracle(path,model_path,random_seed); load_or_train_oracle(...) ", behavior: "GradientBoostingRegressor, 512 estimators, learning_rate .03, max_depth 3, squared_error; random 80/20 split; outputs virtual power labels; auto-trains if artifact absent.", status: virtual_oracle_not_measurement}
  - {component_id: AL-SAMPLER, type: generator_and_selector, path: "AL/catalyst_active_learning_runnable/catalyst_al/sampling.py", interface: "Dirichlet sampling in pipeline; AKDAS(target_point,lambda_param,sigma).select_points(candidates,count)", behavior: "CLR with epsilon 1e-6; Euclidean CLR/Aitchison distance; Gaussian-kernel relevance/diversity.", status: implemented_not_project_validated}
  - {component_id: AL-COST, type: cost_calculator, path: "AL/catalyst_active_learning_runnable/catalyst_al/costs.py", interface: "normalize_ratio(ratio); calculate_normalized_cost(ratio)", behavior: "Fixed order and hardcoded price constants; output 100*weighted sum/Pd price.", status: "relative index only; dated price provenance absent"}
  - {component_id: AL-PARETO, type: selector, path: "AL/catalyst_active_learning_runnable/catalyst_al/pareto.py", interface: "select_pareto_candidates(candidates,top_k,weight)", behavior: "Pareto by UCB/max and normalized cost/min, then weight ordering.", status: "implemented policy not approved for project"}
  - {component_id: AL-DATA, type: data_adapter, path: "AL/catalyst_active_learning_runnable/catalyst_al/data.py", interface: "CSV columns eight metal names plus power_density", behavior: "Drop missing rows and normalize every ratio; no condition, unit, provenance, uncertainty, replicate, or basis contract.", status: "requires project adapter before use"}
metric_candidates:
  - metric_id: M-PPOWER
    name: Peak power density
    aliases: [power_density, P_peak]
    definition: "Device-level peak power density under a locked protocol and declared unit."
    unit: null
    proposed_roles: [primary_objective]
    direction: maximize
    threshold: {value: null, range: [], unit: null, status: baseline_relative, guidance: "Matched protocol baseline and replicate uncertainty; no universal numeric threshold."}
    evaluator_id: AL-ORACLE
    evidence_refs: ["README.md:198-208", "pipeline.py:136-145", "model.py:14-45"]
    expert_status: "core_objective_confirmed_unit_and_protocol_unconfirmed"
    limitation: "AL GBR output is virtual prediction, not experimental measurement; project device label/unit/protocol not established in AL CSV."
  - metric_id: M-COMPOSITION-VALIDITY
    name: Composition validity
    aliases: [fraction_closure, nonnegativity, fixed_order]
    definition: "Eight named mass fractions in project order, finite and nonnegative, summing to one under approved tolerance."
    unit: mass_fraction
    proposed_roles: [hard_constraint]
    direction: target_range
    threshold: {value: "x_i >= 0; sum(x)=1", range: [], unit: mass_fraction, status: validated_hard, tolerance: null, guidance: "Tolerance/precision is still to be approved; reject invalid input rather than renormalize."}
    evaluator_id: PROJECT-SCHEMA-CHECK
    evidence_refs: ["costs.py:6,19-28", "data.py:11-21", "providers.py:49-70"]
    expert_status: "mass_fraction_nonnegativity_closure_and_fixed_order_confirmed"
    unresolved_fields: [closure_tolerance, assay_basis]
  - metric_id: M-NORMALIZED-COST
    name: AL normalized cost index
    aliases: [normalized_cost]
    definition: "100 times weighted hardcoded element-price sum divided by the Pd reference price."
    unit: "relative index (not currency)"
    proposed_roles: [secondary_objective, diagnostic]
    direction: minimize
    threshold: {value: null, range: [], unit: "relative index", status: unresolved, guidance: "No threshold until project accepts formula or replaces dated price table and basis."}
    evaluator_id: AL-COST
    evidence_refs: ["costs.py:6-16,31-34"]
    expert_status: "cost_proxy_selected_price_and_formula_unconfirmed"
    unresolved_fields: [price_date, currency, product_form, catalyst_mass_basis, cost_policy]
  - metric_id: M-ELEMENT-RANGE
    name: Element-content ranges and presence
    aliases: [support_count, element_bounds]
    definition: "Each fraction checked against expert-approved per-element bounds and presence semantics; nominal and measured vectors kept distinct."
    unit: mass_fraction
    proposed_roles: [hard_constraint, diagnostic]
    direction: target_range
    threshold: {value: null, range: [], unit: mass_fraction, status: unresolved, guidance: "Do not impose ranges or exact-eight measured-presence threshold until approved."}
    evaluator_id: PROJECT-SCHEMA-CHECK
    evidence_refs: ["data/initial_examples.csv", "costs.py:19-28"]
    expert_status: "constraint_role_confirmed_numeric_bounds_and_presence_unconfirmed"
    unresolved_fields: [element_min_max, epsilon_presence, nominal_or_measured_enforcement]
  - metric_id: M-EXPERIMENTAL-NOVELTY
    name: Distance to existing experimental compositions
    aliases: [composition_novelty, nearest_neighbor_distance]
    definition: "Nearest-neighbor distance in a declared compositional representation against verified experimental records only."
    unit: "CLR/Aitchison distance (dimensionless) if approved"
    proposed_roles: [diagnostic]
    direction: context_dependent
    threshold: {value: null, range: [], unit: null, status: unresolved, guidance: "Set applicability/novelty decision rule from measured-data validation; exclude virtual/oracle records from experimental reference pool."}
    evaluator_id: AL-SAMPLER
    evidence_refs: ["sampling.py:6-25,28-53"]
    expert_status: "diagnostic_requested_distance_definition_unconfirmed"
    unresolved_fields: [reference_dataset_labels, out_of_domain_rule]
  - metric_id: M-PREDICTION-CONFIDENCE
    name: Prediction confidence / committee disagreement
    aliases: [llm_std, UCB]
    definition: "AL currently reports repeated LLM prediction mean/std and UCB; this is disagreement, not calibrated confidence."
    unit: "same unit as LLM response; currently unspecified"
    proposed_roles: [diagnostic]
    direction: context_dependent
    threshold: {value: null, range: [], unit: null, status: unresolved, guidance: "Calibrate against held-out measured device data before treating as predictive uncertainty; outlier disagreement routes to review."}
    evaluator_id: AL-LLM
    evidence_refs: ["providers.py:72-92", "pipeline.py:115-128"]
    expert_status: "diagnostic_requested_calibration_unconfirmed"
    unresolved_fields: [LLM_output_unit, calibration, acceptable_disagreement]
  - metric_id: M-STABILITY
    name: Stability of high-performance formulations
    aliases: [retention, degradation]
    definition: "Retention or degradation of a specified response after a defined time/cycle/environment protocol."
    unit: null
    proposed_roles: [deferred, hard_constraint]
    direction: maximize
    threshold: {value: null, range: [], unit: null, status: unresolved, guidance: "No stability data, protocol, or implementation found; do not activate until added and approved."}
    evaluator_id: EXPERIMENT-INTERFACE-TBD
    evidence_refs: ["README.md:198-208", "config.json"]
    expert_status: "diagnostic_requested_stability_definition_unconfirmed"
    unresolved_fields: [response, duration, environment, failure_rule, minimum_retention]
metric_decisions:
  - {metric_id: M-COMPOSITION-VALIDITY, final_role: hard_constraint, rank: 1, ranking_basis: [invalid vectors must not reach generator/model, deterministic precheck], direction: target_range, threshold: {status: unresolved, value: "nonnegative and sum=1; tolerance requires approval"}, evaluator_id: PROJECT-SCHEMA-CHECK, decision_status: proposed, evidence_refs: ["data.py:11-21"]}
  - {metric_id: M-PPOWER, final_role: primary_objective, rank: 2, ranking_basis: [computer expert confirmed core performance target, device protocol/units still missing], direction: maximize, threshold: {status: baseline_relative, value: null}, evaluator_id: AL-ORACLE, decision_status: proposed, evidence_refs: ["pipeline.py:136-145"]}
  - {metric_id: M-ELEMENT-RANGE, final_role: hard_constraint, rank: 3, ranking_basis: [ranges are feasibility policy but values not supplied; otherwise diagnostic], direction: target_range, threshold: {status: unresolved, value: null}, evaluator_id: PROJECT-SCHEMA-CHECK, decision_status: proposed, evidence_refs: ["data.py:17-20"]}
  - {metric_id: M-NORMALIZED-COST, final_role: secondary_objective, rank: 4, ranking_basis: [cost trade-off is relevant; current index lacks price provenance and policy approval], direction: minimize, threshold: {status: unresolved, value: null}, evaluator_id: AL-COST, decision_status: proposed, evidence_refs: ["costs.py:6-34"]}
  - {metric_id: M-EXPERIMENTAL-NOVELTY, final_role: diagnostic, rank: 5, ranking_basis: [helps identify extrapolation and diverse candidates; no validated cutoff], direction: context_dependent, threshold: {status: unresolved, value: null}, evaluator_id: AL-SAMPLER, decision_status: proposed, evidence_refs: ["sampling.py:18-53"]}
  - {metric_id: M-PREDICTION-CONFIDENCE, final_role: diagnostic, rank: 6, ranking_basis: [selection safeguard but LLM dispersion is uncalibrated and GBR has no uncertainty], direction: context_dependent, threshold: {status: unresolved, value: null}, evaluator_id: AL-LLM, decision_status: proposed, evidence_refs: ["providers.py:72-92"]}
  - {metric_id: M-STABILITY, final_role: deferred, rank: 7, ranking_basis: [scientifically relevant but absent from code/data; protocol required], direction: maximize, threshold: {status: unresolved, value: null}, evaluator_id: EXPERIMENT-INTERFACE-TBD, decision_status: proposed, evidence_refs: ["README.md:198-208"]}
