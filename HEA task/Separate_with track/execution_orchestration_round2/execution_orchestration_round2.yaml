workflow:
  workflow_id: WF-HEA-AL-ROUND2
  status: proposed_paused
  search_space: {definition: "Eight-component project mass-fraction simplex in [Pd, Pt, Au, Cr, Ir, Ce, Cu, Nb].", allowed_regions: [], forbidden_regions: [], expert_rules: ["strict finite nonnegative values", "sum to one at approved tolerance", "map named elements explicitly", "no unapproved element content bounds"]}
  nodes:
    - {node_id: P01, action: review, model_id: "", inputs: [project_data_metadata, AL_demo_data_status, basis_order_protocol], outputs: [approved_data_contract], retry_policy: "pause on conflict", stop_on_failure: true}
    - {node_id: P02, action: check, model_id: PROJECT-SCHEMA-CHECK, inputs: [immutable_raw_records, approved_data_contract], outputs: [valid_rows, rejection_report, condition_coverage], retry_policy: "no silent normalization or row deletion; retain reason-coded exclusions", stop_on_failure: true}
    - {node_id: P03, action: calculate, model_id: AL-COST-001, inputs: [named_composition, approved_price_source], outputs: [separately_labeled_cost_index], retry_policy: "no cost result if price basis/order unconfirmed", stop_on_failure: false}
    - {node_id: P04, action: review, model_id: "", inputs: [metric_registry, cost_policy, bounds, uncertainty_policy], outputs: [approved_objective_and_constraints], retry_policy: "require computer and materials expert signoff", stop_on_failure: true}
    - {node_id: P05, action: review, model_id: "", inputs: [oracle_artifact, training_data, model_provenance], outputs: [approved_simulation_or_measurement_mode], retry_policy: "no train/inference until authorized", stop_on_failure: true}
    - {node_id: P06, action: predict, model_id: AL-LLM-DESIGN-001, inputs: [references, target_pd, target_cost], outputs: [LLM_generated_composition], retry_policy: "external API use requires explicit authorization", stop_on_failure: true}
    - {node_id: P07, action: generate, model_id: AL-AKDAS-001, inputs: [LLM_generated_composition, approved_domain, candidate_budget], outputs: [candidate_batch], retry_policy: "algorithm settings require authorization", stop_on_failure: true}
    - {node_id: P08, action: predict, model_id: AL-LLM-DESIGN-001, inputs: [selected_candidates, similar_examples, committee_size], outputs: [committee_mean_std_UCB], retry_policy: "dispersion remains diagnostic until calibrated", stop_on_failure: true}
    - {node_id: P09, action: select, model_id: AL-PARETO-001, inputs: [P_peak_predictions, normalized_cost, composition_validity], outputs: [Pareto_candidates_with_diagnostics], retry_policy: "do not apply scalar weights unless approved", stop_on_failure: true}
    - {node_id: P10, action: predict, model_id: AL-GBR-ORACLE-001, inputs: [candidate_batch, approved_model_artifact], outputs: [virtual_power_labels], retry_policy: "only in separately approved simulation; label virtual", stop_on_failure: true}
    - {node_id: P11, action: review, model_id: "", inputs: [candidate_results, confidence, novelty, constraints], outputs: [human_candidate_decision], retry_policy: "expert review before synthesis", stop_on_failure: true}
    - {node_id: P12, action: load, model_id: "", inputs: [authorized_experimental_results], outputs: [provenance-linked_measurements], retry_policy: "append immutable observed data", stop_on_failure: true}
    - {node_id: P13, action: export, model_id: "", inputs: [validated_data, predictions, virtual_outputs, measured_results, decisions], outputs: [versioned_round_record], retry_policy: "schema validate; never overwrite existing AL outputs", stop_on_failure: true}
  budget: {max_candidates: null, max_evaluations: null, max_runtime: "", compute_limit: "", llm_calls_per_round_documented_default: 31, authorization_status: not_granted}
  stopping_conditions: ["basis/order or target conditions unresolved", "invalid data or mismatched vector", "unapproved live API/model execution", "model output outside documented range or domain", "budget exceeded", "expert pause"]
