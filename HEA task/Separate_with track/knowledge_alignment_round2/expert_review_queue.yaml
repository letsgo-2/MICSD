review_items:
  - {object_id: C201, question: "Is Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr the project-selected eight-metal system, or only the literature example to be analyzed?", required_expert: "domain + project", reason: "The user requested an eight-component system, while the corpus contains more than one octonary context.", priority: high}
  - {object_id: C202, question: "Should fractions be atomic, molar, or mass fractions for formulation and for measured composition?", required_expert: "materials + experimental", reason: "Closure and cost calculations depend on the basis.", priority: high}
  - {object_id: I201, question: "What device architecture, catalyst role, active area, operating conditions, and power-curve protocol define P_peak?", required_expert: "domain + experimental", reason: "No universal device-level protocol is established by the uploaded corpus.", priority: high}
  - {object_id: I202, question: "Which dated price source, currency, purity/form, and procurement basis define material cost?", required_expert: "project + procurement + computer", reason: "Prices are time-varying and form-dependent.", priority: high}
  - {object_id: I203, question: "Should cost-specific power be a co-objective, a budget-constrained objective, or a reporting diagnostic?", required_expert: "project + domain + computer", reason: "The trade-off policy is not specified.", priority: high}
  - {object_id: I204, question: "What closure tolerance, decimal precision, zero semantics, and detection threshold should be enforced?", required_expert: "computer + experimental", reason: "These choices control valid candidate generation and support count.", priority: high}
  - {object_id: I205, question: "Is exactly eight retained elements a hard constraint on measured composition, nominal composition, or both?", required_expert: "materials + experimental", reason: "Nominal octonary recipes may segregate or lose elements.", priority: high}
  - {object_id: I206, question: "Which elements count as precious metals for the cost constraint: Pd/Pt/Ir only, or Au as well?", required_expert: "materials + project", reason: "Classification changes the composition-cost trade-off.", priority: medium}
  - {object_id: I207, question: "Which phase, ordering, oxide, defect, and morphology states are allowed?", required_expert: "materials", reason: "Ordering and realized structure affect performance independently of nominal composition.", priority: high}
  - {object_id: I208, question: "Which reaction and condition-specific current-density metric should be retained as a secondary target?", required_expert: "domain + experimental", reason: "The corpus spans incompatible reaction contexts.", priority: medium}
  - {object_id: I212, question: "Should entropy be a hard constraint, soft feature, or only a diagnostic, and what convention applies?", required_expert: "materials + computer", reason: "Entropy is not by itself proof of phase stability or catalytic performance.", priority: medium}
  - {object_id: I213, question: "Which adsorbate, surface model, coverage, and DFT protocol define comparable binding descriptors?", required_expert: "computational + materials", reason: "Descriptor values are model- and reaction-specific.", priority: medium}
  - {object_id: ELM-Pd, question: "Is the proposed Pd activity/cost trade-off supported for the selected device rather than transferred from ORR/oxidation literature?", required_expert: "domain", reason: "Element-specific peak-power signs are hypotheses.", priority: medium}
  - {object_id: ELM-Pt, question: "What Pt fraction is scientifically justified after accounting for activity, durability, and cost?", required_expert: "domain + project", reason: "Pt is a likely activity contributor and major cost driver, but no universal optimum exists.", priority: high}
  - {object_id: ELM-Cu, question: "Does Cu improve the selected device through conductivity/ensemble effects without unacceptable dissolution or phase changes?", required_expert: "domain + experimental", reason: "The effect is condition- and structure-dependent.", priority: medium}
  - {object_id: ELM-Au, question: "Is Au required for the selected device, and does its cost justify any measured power or stability gain?", required_expert: "domain + project", reason: "Au is costly and the octonary paper does not establish a universal Au effect.", priority: medium}
  - {object_id: ELM-Ir, question: "What oxidation-side benefit and cost burden does Ir provide in the selected device?", required_expert: "domain + experimental", reason: "Ir relevance depends on reaction and operating environment.", priority: medium}
  - {object_id: ELM-CeNbCr, question: "Which alloy/oxide/interface states make Ce, Nb, and Cr beneficial rather than diluting active conductivity?", required_expert: "materials + experimental", reason: "The proposed defect/interface roles are hypotheses requiring characterization.", priority: high}
