review_items:
  - {object_id: I001, question: "What exact electrochemical device, catalyst role, active-area normalization, operating conditions, and power-curve protocol define peak power density?", required_expert: "domain + experimental", reason: "The uploaded corpus does not establish a single device-level definition or comparable dataset.", priority: high}
  - {object_id: K008, question: "Under the selected device architecture, which catalyst-level metrics are validated predictors or merely diagnostic proxies for peak power density?", required_expert: "domain + experimental + computer", reason: "Catalyst-level metrics and device output are different physical levels.", priority: high}
  - {object_id: I002, question: "Should elemental fractions be nominal recipe values, measured bulk values, measured surface values, or all three?", required_expert: "materials + experimental", reason: "HEA synthesis can produce segregation, loss, or surface enrichment.", priority: high}
  - {object_id: I003, question: "Is exactly eight retained elements a hard constraint, and what detection limit defines presence?", required_expert: "materials + experimental", reason: "An eight-component recipe does not prove eight-element retention.", priority: high}
  - {object_id: I004, question: "Which phases, ordering states, and defect/morphology ranges are acceptable or forbidden?", required_expert: "materials", reason: "HEA, intermetallic, nanoparticle, and multiphase evidence are not interchangeable.", priority: high}
  - {object_id: I008, question: "Which reaction and condition-specific current-density metric is relevant to the device endpoint?", required_expert: "domain + experimental", reason: "The corpus spans HER, OER, ORR, oxidation, and other reactions.", priority: high}
  - {object_id: I012, question: "Is selectivity/Faradaic efficiency a device constraint, and which product is required?", required_expert: "domain + experimental", reason: "The reported products and reactions differ.", priority: medium}
  - {object_id: I015, question: "Which entropy convention and threshold, if any, should be used as a constraint or feature?", required_expert: "materials + computer", reason: "Entropy descriptors are not automatically phase-stability guarantees.", priority: medium}
  - {object_id: I016, question: "Which adsorbate, coverage, surface model, and DFT protocol make binding descriptors comparable?", required_expert: "materials + computational", reason: "Study-specific DFT descriptors cannot be pooled without protocol alignment.", priority: medium}
  - {object_id: I014, question: "What cost basis and critical-element policy should be used?", required_expert: "project + computer", reason: "Cost-specific performance is undefined without boundary conditions.", priority: medium}
  - {object_id: I020, question: "What replicate design and acceptable variance define synthesis and device reproducibility?", required_expert: "experimental + computer", reason: "Reproducibility data are not consistently available in the corpus.", priority: high}
  - {object_id: C001, question: "Which operational HEA definition and phase criteria will govern inclusion?", required_expert: "materials", reason: "The corpus uses HEA/HEM/intermetallic/medium-entropy terminology with possible scope differences.", priority: medium}
  - {object_id: C008, question: "Which standardized terminology or device-specific standard should anchor peak power density?", required_expert: "experimental", reason: "Online terminology retrieval did not yield a validated project-specific standard endpoint.", priority: high}
