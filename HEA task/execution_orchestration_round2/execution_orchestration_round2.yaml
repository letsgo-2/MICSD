    name: OpenAI-compatible LLM composition generator
    role: generator
    status: available_requires_api_configuration
    source: {type: local_api_adapter, location: AL/catalyst_active_learning_runnable/catalyst_al/providers.py, version: openai_package_1.58_to_3}
    entrypoint: {command: "python run.py", script: run.py, environment: .env_with_OPENAI_API_KEY_and_OPENAI_MODEL, working_directory: AL/catalyst_active_learning_runnable}
