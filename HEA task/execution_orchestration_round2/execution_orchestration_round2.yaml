    evidence_refs: [EO2-E003, EO2-E007]
  - model_id: MODEL-LLM-COMMITTEE
    name: LLM committee predictor and UCB calculator
    role: uncertainty_model
    status: available_requires_api_configuration
    source: {type: local_api_adapter, location: AL/catalyst_active_learning_runnable/catalyst_al/providers.py and pipeline.py, version: workspace}
    entrypoint: {command: "python run.py", script: run.py, environment: .env_with_api, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: limited_cli_and_config
      access_level: execute_fixed_after_confirmation
      authorized_parameters: [committee_size, ucb_exploration_weight]
      prohibited_actions: [treat_llm_predictions_as_measurements]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [candidate_ratio, similar_examples, committee_size]
    output_schema: [llm_mean, llm_std, ucb_score]
    supported_metrics: [M001, M007]
    parameters: {committee_size: 3, ucb_exploration_weight: 1.0, prediction_allowed_range: [0, 500]}
    validation: {test_data: outputs/api_check_after_confirmation, metrics: [std_distribution, parse_success], applicability_domain: same_unit_as_examples_prompt, known_failures: [uncalibrated_uncertainty]}
    evidence_refs: [EO2-E007, EO2-E008]
  - model_id: MODEL-AKDAS
    name: CLR/Aitchison AK-DAS selector
    role: generator
    status: available_pending_user_confirmation
    source: {type: local, location: AL/catalyst_active_learning_runnable/catalyst_al/sampling.py, version: workspace}
    entrypoint: {command: "python run.py", script: run.py, environment: Python 3.10-3.12, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: config_file
      access_level: execute_fixed_after_confirmation
      authorized_parameters: [candidate_pool_size, kdas_select_size, lambda_start, lambda_end, kdas_sigma, similar_examples_k]
      prohibited_actions: [run_without_user_confirmation]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [Dirichlet_candidate_pool, LLM_generated_target_ratio]
    output_schema: [selected_candidate_ratios]
    supported_metrics: [M006]
    parameters: {candidate_pool_size: 20000, kdas_select_size: 10, lambda_start: 0.5, lambda_end: 0.7, kdas_sigma: 1.5}
    validation: {test_data: tests/test_core.py, metrics: [simplex_output_shape_and_sum], applicability_domain: positive_simplex_with_epsilon_for_CLR, known_failures: [absolute_distance_threshold_missing]}
    evidence_refs: [EO2-E008, EO2-E009]
  - model_id: MODEL-PARETO-SCORER
    name: Pareto and final weighted scorer
    role: constraint_checker
    status: available_pending_user_confirmation
    source: {type: local, location: AL/catalyst_active_learning_runnable/catalyst_al/pareto.py and pipeline.py, version: workspace}
    entrypoint: {command: "python run.py", script: run.py, environment: Python 3.10-3.12, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: config_file
      access_level: execute_fixed_after_confirmation
      authorized_parameters: [query_top_k, retain_top_k, performance_weight]
      prohibited_actions: [treat_final_score_as_scientific_endpoint]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [candidate_ratio, ucb_score, normalized_cost, power_density]
    output_schema: [retained_flag, final_score]
    supported_metrics: [M001, M005, M009]
    parameters: {query_top_k: 8, retain_top_k: 3, performance_weight: 0.6}
    validation: {test_data: tests/test_core.py, metrics: [no_duplicate_reference_sort], applicability_domain: batch_local_selection, known_failures: [score_not_global]}
    evidence_refs: [EO2-E008, EO2-E009]

reward_components:
  - component_id: RC2-001
    metric_id: M002
    evaluator_id: MODEL-CONSTRAINTS
    role: hard_constraint
    direction: target_range
    threshold: {finite: true, nonnegative: true, vector_length: 8, sum_normalized_to: 1}
    normalization: none
    weight: null
    uncertainty_penalty: none
    missing_policy: reject
    status: active_pending_run_confirmation
    evidence_refs: [EO2-E005]
  - component_id: RC2-002
    metric_id: M003
    evaluator_id: MODEL-CONSTRAINTS
    role: hard_constraint
    direction: target_range
    threshold: {element_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]}
    normalization: none
    weight: null
    uncertainty_penalty: none
    missing_policy: reject
    status: active_pending_run_confirmation
    evidence_refs: [EO2-E003, EO2-E005]
  - component_id: RC2-003
    metric_id: M001
    evaluator_id: MODEL-GBR-ORACLE
    role: objective
    direction: maximize
    threshold: {stop_if_global_best_ge: 200.0, implemented_prediction_guard: [0, 500]}
    normalization: minmax_batch_local_in_final_score
    weight: 0.6
    uncertainty_penalty: handled_indirectly_by_UCB_before_GBR_query
    missing_policy: reject
    status: active_pending_run_confirmation
    evidence_refs: [EO2-E006, EO2-E008]
  - component_id: RC2-004
    metric_id: M005
    evaluator_id: MODEL-COST
    role: soft_constraint
    direction: minimize
    threshold: {target_cost_reduction_mean: 0.03, target_cost_reduction_std: 0.01, floor: 0.1}
    normalization: minmax_batch_local_in_final_score
    weight: 0.4
    uncertainty_penalty: price_basis_pending
    missing_policy: manual_review
    status: active_provisional
    evidence_refs: [EO2-E005, EO2-E008]
  - component_id: RC2-005
    metric_id: M006
    evaluator_id: MODEL-AKDAS
    role: soft_constraint
    direction: maximize
    threshold: {absolute_threshold: null, relative_diversity_penalty: implemented}
    normalization: CLR_Aitchison_kernel
    weight: {lambda_start: 0.5, lambda_end: 0.7}
    uncertainty_penalty: none
    missing_policy: skip
    status: active_diagnostic
    evidence_refs: [EO2-E008]
  - component_id: RC2-006
    metric_id: M007
    evaluator_id: MODEL-LLM-COMMITTEE
    role: soft_constraint
    direction: context_dependent
    threshold: {committee_size: 3, ucb_exploration_weight: 1.0}
    normalization: none
    weight: 1.0
    uncertainty_penalty: "llm_std recorded; high uncertainty increases UCB for exploration but lowers credibility interpretation"
    missing_policy: reject
    status: active_diagnostic
    evidence_refs: [EO2-E007, EO2-E008]

workflow:
  workflow_id: WF-AL-R2
  name: Implemented AL workflow pending confirmation
  status: ready_for_user_confirmation_not_run
  search_space:
    definition: "Eight-dimensional mass-fraction simplex over [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]."
    allowed_regions: ["finite nonnegative vectors normalized to sum 1"]
    forbidden_regions: ["wrong element order", "negative values", "non-finite values", "non-parseable LLM output", "LLM predicted PD outside [0,500]"]
    expert_rules: ["Peak power density is core metric", "Do not describe GBR predictions as real experiments", "Use normalized cost as tradeoff metric"]
  nodes:
    - node_id: WF2-N01
      action: load
      model_id: CONFIG
      inputs: [config.json]
      outputs: [RunConfig]
      retry_policy: fix_config_validation_errors
      stop_on_failure: true
    - node_id: WF2-N02
      action: load
      model_id: MODEL-CONSTRAINTS
      inputs: [data/initial_examples.csv]
      outputs: [initial_examples_with_normalized_cost]
      retry_policy: fix_missing_columns_or_non_numeric_values
      stop_on_failure: true
    - node_id: WF2-N03
      action: train_or_load
      model_id: MODEL-GBR-ORACLE
      inputs: [data/oracle_training_sample.csv, artifacts/oracle_gbr.joblib]
      outputs: [GBR_virtual_oracle]
      retry_policy: train_if_model_missing
      stop_on_failure: true
    - node_id: WF2-N04
      action: generate
      model_id: MODEL-LLM-PROVIDER
      inputs: [target_pd, target_cost, pareto_sorted_reference_examples]
      outputs: [generated_ratio, generated_cost]
      retry_policy: fail_on_parse_error
      stop_on_failure: true
    - node_id: WF2-N05
      action: generate
      model_id: MODEL-AKDAS
      inputs: [Dirichlet_pool, generated_ratio]
      outputs: [selected_candidate_ratios]
      retry_policy: regenerate_if_invalid
      stop_on_failure: true
    - node_id: WF2-N06
      action: predict
      model_id: MODEL-LLM-COMMITTEE
      inputs: [selected_candidate_ratios, similar_examples]
      outputs: [llm_mean, llm_std, ucb_score]
      retry_policy: fail_on_api_or_parse_error
      stop_on_failure: true
    - node_id: WF2-N07
      action: select
      model_id: MODEL-PARETO-SCORER
      inputs: [ucb_score, normalized_cost]
      outputs: [top_candidates]
      retry_policy: return_available_pareto_front
      stop_on_failure: true
    - node_id: WF2-N08
      action: predict
      model_id: MODEL-GBR-ORACLE
      inputs: [top_candidate_ratios]
      outputs: [virtual_power_density]
      retry_policy: fail_on_prediction_error
      stop_on_failure: true
    - node_id: WF2-N09
      action: score
      model_id: MODEL-PARETO-SCORER
      inputs: [virtual_power_density, normalized_cost]
      outputs: [retained_candidates, final_score]
      retry_policy: retain_top_available
      stop_on_failure: true
    - node_id: WF2-N10
      action: export
      model_id: PIPELINE_SAVE
      inputs: [examples, iteration_log, query_log, generated_log, summary]
      outputs: [total_pool_csv, iteration_log_csv, query_log_csv, generated_ratios_csv, summary_json]
      retry_policy: fail_on_write_error
      stop_on_failure: true
  budget:
    default_iterations: 10
    api_check_iterations: 1
    default_candidate_pool_size: 20000
    api_check_candidate_pool_size: 2000
    default_api_calls_per_iteration: 31
