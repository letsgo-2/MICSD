metadata:
  artifact: execution_orchestration
  round: round2
  output_language: English
  created_from_skill: scientific-execution-orchestrator
  status: draft_pending_user_run_confirmation
  model_or_algorithm_locked: true
  locked_by: implemented_AL_folder_inspection
  execution_performed_in_this_update: false

upstream_inputs:
  previous_execution_orchestration: execution_orchestration_round1/
  knowledge_alignment_yaml: knowledge_alignment_round2/knowledge_alignment_round2.yaml
  knowledge_alignment_report: knowledge_alignment_round2/knowledge_alignment_report_round2.md
  expert_review_queue: knowledge_alignment_round2/expert_review_queue_round2.yaml
  al_implementation_path: AL/catalyst_active_learning_runnable
  input_status: loaded_and_inspected

execution_context:
  project_goal: "Iteratively optimize octonary HEA catalyst formulations with peak power density as core performance metric while tracking cost, validity, novelty, credibility, and high-performance stability."
  canonical_element_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
  composition_type: mass_fraction_vector
  sample_unit: catalyst_formulation_record
  formal_execution_allowed: false
  reason_not_active: "User requested run procedure confirmation and no unauthorized execution."
  run_path_status: available_pending_user_confirmation

metric_candidates:
  - metric_id: M001
    name: Peak power density
    aliases: [power_density, maximum_power_density, peak_power_density]
    definition: "Core performance target for formulation optimization."
    proposed_roles: [primary_objective]
    direction: maximize
    threshold:
      value: null
      range: [0.02709, 75.45]
      unit: local_power_density_unit_pending
      status: local_training_range_from_data_readme
      implemented_prediction_guard: [0, 500]
      implemented_stop_threshold: 200.0
    conditions: [CSV_target_column_power_density]
    acquisition: [CSV_input, LLM_prediction, GBR_virtual_oracle]
    evidence_refs: [EO2-E003, EO2-E006, EO2-E007, EO2-E008]
    expert_status: core_metric_confirmed
    unresolved_fields: [physical_unit]
  - metric_id: M002
    name: Composition validity
    aliases: [simplex_validity, normalized_ratio_validity]
    definition: "Candidate vector is finite, length 8, nonnegative, and normalizable to sum 1."
    proposed_roles: [hard_constraint]
    direction: target_range
    threshold:
      finite: true
      nonnegative: true
      vector_length: 8
      sum_rule: "sum > 0 before normalization; normalized to sum 1"
      status: implemented
    conditions: [all_data_rows, all_generated_candidates]
    acquisition: [normalize_ratio, _read_and_validate, provider_parser]
    evidence_refs: [EO2-E005, EO2-E007]
    expert_status: confirmed
    unresolved_fields: []
  - metric_id: M003
    name: Fixed element order
    aliases: [schema_order]
    definition: "All inputs and outputs use Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr order."
    proposed_roles: [hard_constraint]
    direction: target_range
    threshold:
      value: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
      status: implemented
    conditions: [all_interfaces]
    acquisition: [README, METAL_ORDER, provider_prompt, output_writer]
    evidence_refs: [EO2-E003, EO2-E005, EO2-E007, EO2-E008]
    expert_status: confirmed_for_AL_path
    unresolved_fields: []
  - metric_id: M004
    name: Element content ranges
    aliases: [element_bounds]
    definition: "Allowed per-element mass-fraction bounds."
    proposed_roles: [hard_constraint, soft_constraint]
    direction: target_range
    threshold:
      lower_bound: 0.0
      upper_bound: 1.0
      status: mathematical_simplex_only
    conditions: [generated_candidates]
    acquisition: [normalize_ratio]
    evidence_refs: [EO2-E005]
    expert_status: synthesis_bounds_pending
    unresolved_fields: [synthesis_specific_min_max, dispensing_resolution]
  - metric_id: M005
    name: Normalized cost
    aliases: [normalized_catalyst_cost]
    definition: "Weighted composition cost normalized by Pd price and multiplied by 100."
    proposed_roles: [secondary_objective, soft_constraint]
    direction: minimize
    threshold:
      reference: pure_Pd_equals_100
      formula: "dot(ratio, [26393,20325,4.53,29298,23926,5.37,32.22,5.86]) / 26393 * 100"
      status: implemented_provisional
    conditions: [normalized_composition]
    acquisition: [calculate_normalized_cost]
    evidence_refs: [EO2-E005]
    expert_status: price_basis_pending
    unresolved_fields: [price_source_date]
  - metric_id: M006
    name: Candidate difference from existing samples
    aliases: [novelty, diversity, Aitchison_distance_to_examples]
    definition: "Difference from existing sample pool measured in CLR/Aitchison-like space and used in AK-DAS selection and similar-example retrieval."
    proposed_roles: [diagnostic, selection_metric]
    direction: maximize_or_balance_with_relevance
    threshold:
      value: null
      status: implemented_without_absolute_threshold
    conditions: [candidate_selection]
    acquisition: [clr_transform, find_similar_examples, AKDAS]
    evidence_refs: [EO2-E008, local_literature_compositional_data]
    expert_status: implemented_as_selection_behavior
    unresolved_fields: [absolute_novelty_threshold]
  - metric_id: M007
    name: Model prediction credibility
    aliases: [LLM_committee_uncertainty, prediction_uncertainty, UCB]
    definition: "Credibility proxy from repeated LLM predictions; std represents spread and UCB combines mean with exploration uncertainty."
    proposed_roles: [diagnostic, acquisition_metric]
    direction: minimize_std_or_manage_with_UCB
    threshold:
      committee_size: 3
      ucb_formula: "llm_mean + ucb_exploration_weight * llm_std"
      ucb_exploration_weight: 1.0
      prediction_allowed_range: [0, 500]
      status: implemented
    conditions: [LLM_committee_prediction]
    acquisition: [predict_committee, pipeline_scored_candidates]
    evidence_refs: [EO2-E007, EO2-E008]
    expert_status: implemented
    unresolved_fields: [credibility_acceptance_threshold]
  - metric_id: M008
    name: High-performance formulation stability
    aliases: [stability_of_high_performance_recipes, robust_high_PD]
    definition: "Whether high peak-power-density behavior persists across retained candidates, nearby compositions, or repeated iterations."
    proposed_roles: [diagnostic]
    direction: maximize
    threshold:
      value: null
      status: proposed_not_explicitly_implemented
      suggested_sources: [iteration_log, total_pool, query_log]
    conditions: [post_run_analysis]
    acquisition: [log_analysis]
    evidence_refs: [EO2-E008]
    expert_status: pending_definition
    unresolved_fields: [stability_metric_formula, threshold]
  - metric_id: M009
    name: Final score
    aliases: [weighted_batch_score]
    definition: "Batch-local weighted score combining normalized virtual-oracle power density and normalized cost."
    proposed_roles: [selection_metric]
    direction: maximize
    threshold:
      formula: "performance_weight * normalized_power - (1-performance_weight) * normalized_cost"
      performance_weight: 0.6
      status: implemented
    conditions: [queried_batch]
    acquisition: [_score_and_retain]
    evidence_refs: [EO2-E008]
    expert_status: implemented_selection_not_core_science_metric
    unresolved_fields: []

metric_decisions:
  - metric_id: M001
    final_role: primary_objective
    rank: 1
    ranking_basis: ["Computer expert finalized peak power density as core performance metric.", "Implemented AL uses power_density as target, LLM prediction output, GBR oracle output, and summary best metric."]
    direction: maximize
    threshold: {implemented_stop_threshold: 200.0, prediction_guard: [0, 500], local_training_range: [0.02709, 75.45]}
    evaluator_id: MODEL-GBR-ORACLE_and_MODEL-LLM-COMMITTEE
    decision_status: active_pending_run_confirmation
    evidence_refs: [EO2-E003, EO2-E006, EO2-E007, EO2-E008]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M002
    final_role: hard_constraint
    rank: 2
    ranking_basis: ["Nonnegative and sum-to-1 composition constraints are final expert requirements.", "Implemented code normalizes and rejects invalid vectors."]
    direction: target_range
    threshold: {finite: true, nonnegative: true, vector_length: 8, sum_after_normalization: 1}
    evaluator_id: MODEL-CONSTRAINTS
    decision_status: active_pending_run_confirmation
    evidence_refs: [EO2-E005]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M003
    final_role: hard_constraint
    rank: 3
    ranking_basis: ["Fixed element order is final expert requirement.", "AL path implements Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr everywhere inspected."]
    direction: target_range
    threshold: {element_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]}
    evaluator_id: MODEL-CONSTRAINTS
    decision_status: active_pending_run_confirmation
    evidence_refs: [EO2-E003, EO2-E005, EO2-E007]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M004
    final_role: hard_constraint
    rank: 4
    ranking_basis: ["Element ranges control formulation feasibility.", "Current code only implements mathematical nonnegative simplex; real synthesis bounds need expert input."]
    direction: target_range
    threshold: {current_lower_bound: 0.0, current_upper_bound: 1.0, status: synthesis_bounds_pending}
    evaluator_id: MODEL-CONSTRAINTS
    decision_status: active_for_nonnegative_only
    evidence_refs: [EO2-E005]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M005
    final_role: soft_constraint
    rank: 5
    ranking_basis: ["Materials expert requested cost tracking.", "AL code uses normalized cost in target generation, Pareto screening, and final score."]
    direction: minimize
    threshold: {reference: pure_Pd_equals_100, price_basis_status: pending}
    evaluator_id: MODEL-COST
    decision_status: active_provisional
    evidence_refs: [EO2-E005, EO2-E008]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M006
    final_role: diagnostic
    rank: 6
    ranking_basis: ["Materials expert requested candidate difference from existing samples.", "AL implements CLR/Aitchison similar-example retrieval and AK-DAS diversity selection."]
    direction: maximize_or_balance
    threshold: {absolute_threshold: null, status: implemented_relative_selection}
    evaluator_id: MODEL-AKDAS
    decision_status: active_diagnostic
    evidence_refs: [EO2-E008]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M007
    final_role: diagnostic
    rank: 7
    ranking_basis: ["Computer-facing model credibility is needed before trusting candidates.", "AL implements LLM committee mean/std and UCB score."]
    direction: context_dependent
    threshold: {committee_size: 3, prediction_allowed_range: [0, 500], credibility_cutoff: null}
    evaluator_id: MODEL-LLM-COMMITTEE
    decision_status: active_diagnostic
    evidence_refs: [EO2-E007, EO2-E008]
    expert_feedback_refs: [user_round2_request]
  - metric_id: M008
    final_role: diagnostic
    rank: 8
    ranking_basis: ["Materials expert requested high-performance stability.", "Current AL logs allow post-run stability analysis but no explicit stability metric is implemented."]
    direction: maximize
    threshold: {status: proposed_post_processing}
    evaluator_id: MODEL-POSTPROCESS-STABILITY
    decision_status: proposed
    evidence_refs: [EO2-E008]
    expert_feedback_refs: [user_round2_request]

model_interfaces:
  - model_id: MODEL-CONSTRAINTS
    name: Composition validator and normalizer
    role: constraint_checker
    status: available_pending_user_confirmation
    source: {type: local, location: AL/catalyst_active_learning_runnable/catalyst_al/costs.py, version: workspace}
    entrypoint: {command: "import/use normalize_ratio", script: "", environment: Python 3.10-3.12, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: false
      access_level: execute_fixed_after_confirmation
      authorized_parameters: []
      prohibited_actions: [run_without_user_confirmation, modify_original_code]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
    output_schema: [normalized_ratio_or_error]
    supported_metrics: [M002, M003, M004]
    parameters: {element_order: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]}
    validation: {test_data: tests/test_core.py, metrics: {}, applicability_domain: eight_element_mass_fraction_vectors, known_failures: [synthesis_bounds_not_encoded]}
    evidence_refs: [EO2-E005, EO2-E009]
  - model_id: MODEL-COST
    name: Normalized cost calculator
    role: constraint_checker
    status: available_pending_user_confirmation
    source: {type: local, location: AL/catalyst_active_learning_runnable/catalyst_al/costs.py, version: workspace}
    entrypoint: {command: "import/use calculate_normalized_cost", script: "", environment: Python 3.10-3.12, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: false
      access_level: execute_fixed_after_confirmation
      authorized_parameters: []
      prohibited_actions: [treat_price_table_as_certified_market_data]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
    output_schema: [normalized_cost]
    supported_metrics: [M005]
    parameters: {Pd: 26393.0, Pt: 20325.0, Cu: 4.53, Au: 29298.0, Ir: 23926.0, Ce: 5.37, Nb: 32.22, Cr: 5.86, reference: Pd}
    validation: {test_data: tests/test_core.py, metrics: {pure_Pd_cost: 100.0}, applicability_domain: provisional_cost_screening, known_failures: [price_source_date_missing]}
    evidence_refs: [EO2-E005, EO2-E009]
  - model_id: MODEL-GBR-ORACLE
    name: GBR virtual experimental oracle
    role: surrogate
    status: available_pending_user_confirmation
    source: {type: local, location: AL/catalyst_active_learning_runnable/catalyst_al/model.py, version: scikit-learn_1.6.1}
    entrypoint: {command: "python train_oracle.py or automatic load_or_train_oracle via python run.py", script: train_oracle.py, environment: Python 3.10-3.12, working_directory: AL/catalyst_active_learning_runnable}
    human_provision:
      model_information_provided: true
      script_location_provided: true
      executable_interface_exposed: true
      parameter_interface_exposed: false
      access_level: execute_fixed_after_confirmation
      authorized_parameters: []
      prohibited_actions: [claim_as_real_experiment, run_without_user_confirmation]
      provided_by: AL_folder
      confirmation_ref: user_round2_request
    input_schema: [Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr]
    output_schema: [power_density_prediction]
    supported_metrics: [M001]
    parameters: {n_estimators: 512, learning_rate: 0.03, max_depth: 3, loss: squared_error, test_size: 0.2, random_seed: 42}
