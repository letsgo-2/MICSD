project:
  project_goal: "optimize elemental ratios of an eight-component high-entropy alloy electrocatalyst to improve peak power density"
  domain: "high-entropy alloy electrocatalysts for direct formate fuel-cell-related electrochemical performance"
  output_language: English
  round: round1
  primary_evidence:
    - evidence_id: E001
      source: literature_markdown/26_Zhang_2025_Multimodal_robotic_electrocatalyst_discovery.md
      doi: https://doi.org/10.1038/s41586-025-09640-5
  web_search_allowed: true
  web_search_note: "Exa search was rate-limited; direct web fetch was used for IUPAC, EMMO, and DOI metadata."

concepts:
  - concept_id: C001
    name: Eight-component HEA electrocatalyst
    definition: "Project-level octonary Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr multi-element alloy catalyst used for formate oxidation electrocatalysis."
    synonyms: [octonary catalyst, HEA-8D, Pd-Pt-Cu-Au-Ir-Ce-Nb-Cr catalyst]
    parent_concept: high-entropy alloy electrocatalyst
    ontology_source: {name: project local concept, iri_or_url: null, version_or_access_date: 2026-07-30}
    mapping_status: local
    evidence: [E001, E004, E012]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C002
    name: High-entropy alloy
    definition: "Multi-principal-element / complex concentrated alloy concept used here for compositionally complex alloy electrocatalysts; exact entropy threshold not fixed by the primary paper."
    synonyms: [HEA, multi-principal element alloy, complex concentrated alloy]
    parent_concept: alloy
    ontology_source: {name: literature-derived terminology, iri_or_url: null, version_or_access_date: 2026-07-30}
    mapping_status: close
    evidence: [E006, E007]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C003
    name: Catalyst
    definition: "A substance that increases the rate of a reaction without modifying the overall standard Gibbs energy change."
    synonyms: [accelerator, kinetic synergist]
    parent_concept: chemical substance
    ontology_source: {name: IUPAC Gold Book, iri_or_url: https://doi.org/10.1351/goldbook.C00876, version_or_access_date: Version 5.0.0 accessed 2026-07-30}
    mapping_status: exact
    evidence: [E008]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C004
    name: Electrode reaction
    definition: "Interfacial electrode process including at least one elementary charge-transfer step, with current controlled by kinetics and transport at a given potential."
    synonyms: []
    parent_concept: electrochemical process
    ontology_source: {name: IUPAC Gold Book, iri_or_url: https://doi.org/10.1351/goldbook.E01960, version_or_access_date: Version 5.0.0 accessed 2026-07-30}
    mapping_status: exact
    evidence: [E009]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C005
    name: Direct formate fuel cell
    definition: "Electrochemical device context used to validate selected catalysts via polarization curves with formate electrolyte."
    synonyms: [DFFC]
    parent_concept: electrochemical device
    ontology_source: {name: EMMO Domain Electrochemistry Ontology, iri_or_url: https://w3id.org/emmo/domain/electrochemistry, version_or_access_date: accessed 2026-07-30}
    mapping_status: close
    evidence: [E003, E004, E014]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C006
    name: Composition vector
    definition: "Eight-dimensional non-negative vector ordered Pd, Pt, Cu, Au, Ir, Ce, Nb, Cr and normalized to sum to 1 in local data/code."
    synonyms: [elemental ratio vector, catalyst ratio]
    parent_concept: compositional data
    ontology_source: {name: project local concept, iri_or_url: null, version_or_access_date: 2026-07-30}
    mapping_status: local
    evidence: [E011, E012, E013]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C007
    name: Single FCC solid-solution phase
    definition: "Structural state reported by XRD/Rietveld for the optimized octonary catalyst."
    synonyms: [single face-centered-cubic phase]
    parent_concept: crystalline phase
    ontology_source: {name: project local concept, iri_or_url: null, version_or_access_date: 2026-07-30}
    mapping_status: local
    evidence: [E005]
    expert_status: "accepted_in_principle_from_dialogue"
  - concept_id: C008
    name: Poisoning tolerance
    definition: "Resistance to hydrogen poisoning and CO poisoning relative to pure Pd in formate oxidation mechanism."
    synonyms: [CO poisoning resistance, hydrogen poisoning resistance]
    parent_concept: catalyst durability/mechanism descriptor
    ontology_source: {name: project local concept, iri_or_url: null, version_or_access_date: 2026-07-30}
    mapping_status: local
    evidence: [E005]
    expert_status: "accepted_in_principle_from_dialogue"

