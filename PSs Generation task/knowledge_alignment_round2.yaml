    expert_feedback_refs: [PS-KA-R2-BASE]

scaffold_families:
  - scaffold_id: S001
    name: "Zinc phthalocyanine / cationic phthalocyanine"
    representative_molecules: ["1Zn-Et", "2Zn-Et", "compound 5"]
    favorable_properties:
      - "Strong red/far-red absorption; nonperipheral substitution can red-shift the Q-band beyond 750 nm."
      - "Zinc center supports higher singlet-oxygen quantum yield and stronger PDT cytotoxicity than magnesium analogs in the cited series."
      - "Rigid bulky cationic substitution can suppress aqueous aggregation while preserving singlet-oxygen production."
    design_roles: ["type-II PDT", "therapeutic-window absorption", "low-dark-toxicity candidate series"]
    cautions:
      - "Cationic count, substitution position, water behavior, and dark toxicity must be optimized together."
      - "Non-aggregation is favorable for this ordinary phthalocyanine evidence set but should not be generalized to AIE scaffolds."
    evidence: [E006, E011, E013, E016, E017]
    expert_status: "accepted_as_reference_scaffold_family"
  - scaffold_id: S002
    name: "Porphyrin / metalloporphyrin"
    representative_molecules: ["3-PdTPyP", "Zn(II) N-alkylpyridylporphyrins", "Gd-TCPP/Gd-PNPs"]
    favorable_properties:
      - "Mature macrocyclic photosensitizer class with tunable metal centers, charge, lipophilicity, and imaging/therapy integration."
      - "Meta tetra-cationic Pd(II) porphyrin showed stronger antimicrobial PDT than its para isomer."
      - "Cationic charge plus tuned lipophilicity improved mitochondrial uptake and mitochondrial photodamage in the Zn porphyrin series."
    design_roles: ["antimicrobial PDT", "mitochondria-targeted PDT", "imaging-guided PDT"]
    cautions:
      - "MIC, mammalian-cell IC50, and in vivo tumor endpoints should not be merged as the same label."
      - "Metal center and lipophilicity may improve efficacy but can also change toxicity and biodistribution."
    evidence: [E010, E015]
    expert_status: "confirmed_as_working_scaffold_family"
    expert_feedback_refs: [PS-EO-R1-INPUTS]
  - scaffold_id: S003
    name: "D-A / D-B-A organic type-I scaffold"
    representative_molecules: ["NI-TA"]
    favorable_properties:
      - "Donor-bridge-acceptor design can tune HOMO/LUMO distribution, triplet energy, and electron-transfer behavior."
      - "NI-TA evidence supports superoxide-selective photogeneration with little singlet oxygen or hydroxyl radical signal under tested conditions."
    design_roles: ["type-I ROS", "hypoxia-relevant PDT", "photopyroptosis"]
    cautions:
      - "DFT/TD-DFT proxies must be benchmarked against EPR/probe data."
      - "Different papers use different oxygen-sensitization thresholds; threshold choice must be stated."
    evidence: [E018]
    expert_status: "accepted_as_reference_scaffold_family"
  - scaffold_id: S004
    name: "AIE donor-acceptor photosensitizer"
    representative_molecules: ["TBD-1C", "TBD-2C", "TBD-3C", "D1"]
    favorable_properties:
      - "Aggregate-state emission and ROS generation can avoid aggregation-caused quenching."
      - "Cationic-chain number in TBD-R strengthens membrane anchoring; D1 dimerization improves ROS, photothermal conversion, and tumor retention."
    design_roles: ["membrane-localized PDT", "photopyroptosis", "PDT/PTT synergy", "self-assembled photosensitizers"]
    cautions:
      - "Aggregation direction is scaffold-dependent: ordinary phthalocyanines often prefer non-aggregation, while AIE systems may require productive aggregation."
      - "Self-assembly effects may require aggregate-level descriptors beyond single-molecule DFT."
    evidence: [E014, E019]
    expert_status: "accepted_as_reference_scaffold_family"
  - scaffold_id: S005
    name: "Cation-clamping / mitochondria-targeting structure"
    representative_molecules: ["1d"]
    favorable_properties:
      - "Pyridinium or imidazolium clamping can strengthen mitochondrial electrostatic targeting and localized ROS production."
      - "1d showed mitochondrial colocalization and rapid GSDME-linked photopyroptosis under red-light activation."
    design_roles: ["mitochondria-targeted photopyroptosis", "immune-activation-oriented PDT"]
    cautions:
      - "Cationic targeting strength should be a target range rather than a monotonic maximize objective."
    evidence: [E008]
    expert_status: "accepted_as_reference_scaffold_family"
  - scaffold_id: S006
    name: "Metal complex / membrane-anchored hypoxia-active scaffold"
    representative_molecules: ["CA-Re"]
    favorable_properties:
      - "CAIX-associated membrane anchoring and mixed ROS profile support nanomolar phototoxicity under hypoxia."
      - "Evidence points to superoxide/peroxynitrite/lipid-peroxidation contributions rather than a purely singlet-oxygen mechanism."
    design_roles: ["hypoxic tumor PDT", "membrane damage", "immunogenic cell death"]
    cautions:
      - "Applicability depends on CAIX biology and tumor context; metal-complex DFT/SOC treatment needs computational expert review."
    evidence: [E012]
    expert_status: "accepted_as_reference_scaffold_family"

