scaffolds:
  - scaffold_id: R2-S001
    name: "ZnPc / phthalocyanine"
    advantages: ["long-wavelength Q-band", "high molar absorption coefficient", "high singlet oxygen potential", "rich substitution chemistry"]
    risks: ["water aggregation", "low solubility", "PET quenching in some substituent patterns"]
    tunable_sites: ["central metal", "peripheral/nonperipheral substituents", "cationic bulky groups"]
    recommended_branch: "type_II_or_mixed_PDT"
    evidence: [R2-E001, R2-E002]
    expert_status: pending
  - scaffold_id: R2-S002
    name: "AIE D-A / D-A-pi-A"
    advantages: ["aggregate-state photosensitization", "ICT-tunable absorption/ISC", "cationic anchoring"]
    risks: ["cationic dark toxicity", "mechanism depends on localization and aggregate state"]
    tunable_sites: ["donor", "acceptor", "pi bridge", "cationic chain number"]
    recommended_branch: "hypoxia_type_I_or_localized_PDT"
    evidence: [R2-E003]
    expert_status: pending
  - scaffold_id: R2-S003
    name: "D-A-D conjugated oligomer / BODIPY acceptor"
    advantages: ["ICT", "enhanced ISC", "ROS", "low bandgap", "photothermal co-activity"]
    risks: ["PDT/PTT contribution entanglement", "application context may be antibacterial rather than tumor"]
    tunable_sites: ["donor strength", "acceptor strength", "conjugation length"]
    recommended_branch: "scaffold_refinement_or_dual_photoactive"
    evidence: [R2-E004]
    expert_status: pending
  - scaffold_id: R2-S004
    name: "Nile-blue Type-I photodrug"
    advantages: ["near-infrared absorption", "Type-I radical generation", "targeting functionalization"]
    risks: ["narrower scaffold space", "requires radical probe validation"]
    tunable_sites: ["terminal targeting group", "cationic/lipophilic group"]
    recommended_branch: "hypoxia_type_I_PDT"
    evidence: [R2-E005]
    expert_status: pending
  - scaffold_id: R2-S005
    name: "Re(I) or other metal complexes"
    advantages: ["strong excited-state effects", "targeting ligand integration", "hypoxic Type-I/II activity"]
    risks: ["metal toxicity", "coordination stability", "translation risk"]
    tunable_sites: ["metal center", "ligand", "targeting group"]
    recommended_branch: "separate_metal_complex_branch"
    evidence: [R2-E006, R2-E007]
    expert_status: pending
  - scaffold_id: R2-S006
    name: "Bacteriochlorin / copper-bacteriochlorin nanosheet"
    advantages: ["750 nm activation", "multiple ROS routes", "tumor microenvironment activation"]
    risks: ["nanoplatform not directly comparable to small molecule", "metal release safety"]
    tunable_sites: ["metal", "assembly", "GSH response"]
    recommended_branch: "specialized_theranostic_or_pyroptosis"
    evidence: [R2-E008]
    expert_status: pending
  - scaffold_id: R2-S007
    name: "Porphyrin/metalloporphyrin polymer"
    advantages: ["established PDT platform", "1O2", "imaging integration", "polymer nanoparticle stability"]
    risks: ["nanoparticle confounds molecular reward", "requires biodistribution experiments"]
    tunable_sites: ["metal center", "meso substituent", "polymer/self-assembly"]
    recommended_branch: "type_II_or_theranostic"
    evidence: [R2-E009, R2-E010]
    expert_status: pending

indicators:
  - indicator_id: R2-I001
    name: "TD-DFT吸收波长λabs"
    definition: "由主要电子跃迁激发能换算得到的吸收波长。"
    unit: "nm"
    conditions: ["functional", "basis set", "solvent model", "selected transition"]
    domain_meaning: "光源匹配和组织穿透代理"
    audience: computer_expert
    obtainable_by: [physics_compute]
    optimization_role: primary_objective
    optimization_direction: target_range
    importance: 5
    computability: 5
    data_readiness: 4
    priority: P0
    calculation: "TD-DFT vertical excitation energy E(eV); lambda_nm = 1240 / E"
    initial_reward_threshold: "600-800 nm high score; 650-750 nm preferred initial PDT window; outside range soft penalty"
    threshold_status: "literature_supported_initial_threshold"
    evidence: [R2-O001]
    expert_status: pending
  - indicator_id: R2-I002
    name: "oscillator strength"
