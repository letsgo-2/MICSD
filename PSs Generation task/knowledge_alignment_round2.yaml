computational_proxy_indicators:
  - proxy_id: CP001
    name: "TD-DFT absorption maximum"
    symbol: "lambda_max"
    unit: "nm"
    calculation: "Compute vertical excitation energies by TD-DFT or TDA-TD-DFT; convert E(eV) to wavelength by lambda(nm)=1240/E(eV)."
    meaning: "Proxy for whether the molecule can be activated by therapeutically useful light."
    optimization_role: constraint
    optimization_direction: target_range
    initial_reward_rule:
      pass: "lambda_max >= 650 nm"
      strong: "700-800 nm"
      relaxed_if_needed: ">= 520 nm when the experimental platform only supports visible-light activation"
    linked_endpoints: [I001, I007]
    evidence: [E016, E020]
    caveat: "Threshold is a reward initialization, not an experimentally certified rule."
  - proxy_id: CP002
    name: "Oscillator strength in the activation window"
    symbol: "f"
    unit: "dimensionless"
    calculation: "Use oscillator strength of the main TD-DFT transition near the intended activation wavelength."
    meaning: "Proxy for absorption intensity; a molecule with a suitable wavelength but negligible oscillator strength may be poorly activated."
    optimization_role: constraint
    optimization_direction: maximize
    initial_reward_rule:
      pass: "f > 0.05"
      saturate: "f >= 0.3"
    linked_endpoints: [I001, I007]
    evidence: [E020]
    caveat: "Absolute values depend on method and conformation; compare primarily within a scaffold family."
  - proxy_id: CP003
    name: "Accessible intersystem crossing gap"
    symbol: "min_delta_E_S1_Tn"
    unit: "eV"
    calculation: "Compute S1 and nearby triplet states; take the minimum energy gap between S1 and a plausible Tn state."
    meaning: "Proxy for whether ISC from S1 to a triplet state is energetically accessible."
    optimization_role: intermediate
    optimization_direction: minimize
    initial_reward_rule:
      pass: "min DeltaE(S1-Tn) < 0.4 eV"
      strong: "< 0.2 eV"
    linked_endpoints: [I004, I005]
    evidence: [E007, E020]
    caveat: "Energy proximity alone is insufficient; pair with SOC where possible."
  - proxy_id: CP004
    name: "Spin-orbit coupling between S1 and accessible Tn"
    symbol: "SOC(S1,Tn)"
    unit: "cm^-1"
    calculation: "Compute SOC for candidate S1/Tn pairs with quantum-chemistry software that supports SOC."
    meaning: "Proxy for ISC probability and triplet formation tendency."
