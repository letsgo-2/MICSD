review_items:
  - object_id: PROJECT.application_context
    question: "最终应用场景是肿瘤 PDT、光焦亡免疫治疗、抗菌 PDT，还是更一般的光敏材料筛选？不同场景会改变主目标和约束权重。"
    required_expert: "材料/应用领域专家"
    reason: "当前论文证据覆盖多个应用域，不能自动合并成单一优化任务。"
    priority: high
  - object_id: I001
    question: "光毒性主指标应采用细胞 IC50/EC50、抗菌 MIC、肿瘤抑制率，还是按应用场景拆分多个目标？"
    required_expert: "材料专家 + 实验专家 + 计算机专家"
    reason: "不同 assay 的数值不可直接比较，跨论文条件差异很大。"
    priority: high
  - object_id: I003
    question: "是否将 TC50/IC50 或 dark IC50/light IC50 作为统一的主目标？需要确认同一细胞系、同一条件下配对计算。"
    required_expert: "实验专家"
    reason: "该指标很有用，但跨细胞系、跨光照条件会造成虚高或不可比。"
    priority: high
  - object_id: I004
    question: "单线态氧量子产率是否作为主优化目标还是诊断指标？对于 Type-I 或低氧目标，它可能不是主导机制。"
    required_expert: "材料/光化学专家"
    reason: "证据中既有 type-II singlet oxygen 主导体系，也有 type-I/hypoxia-active 体系。"
    priority: high
  - object_id: I005
    question: "Type-I ROS 生成能力应如何标准化？采用 EPR、DHE/HPF/DCFH-DA、清除剂实验，还是多指标组合？"
    required_expert: "光化学专家 + 实验专家"
    reason: "ROS 探针特异性有限，不同论文报告方式不同。"
    priority: high
  - object_id: I006
    question: "是否把低氧保留光毒性设为 P0？若目标是实体瘤低氧 PDT，应升为硬主目标。"
    required_expert: "材料/肿瘤应用专家"
    reason: "当前项目目标只写“更高光敏性能”，没有明确是否优先低氧场景。"
    priority: high
  - object_id: I007
    question: "治疗窗口目标范围应设为红光、近红外，还是由实际设备决定？是否要求 extinction coefficient 下限？"
    required_expert: "材料专家 + 实验平台负责人"
    reason: "论文中波长从 425/520/525/570/640 nm 到白光 LED 不等，不能自动统一。"
    priority: high
  - object_id: I008
    question: "聚集行为应优化为非聚集，还是允许 AIE/自组装型聚集？请按分子类别区分规则。"
    required_expert: "材料/光物理专家"
    reason: "化合物 5 证据支持非聚集，D1/TBD 系列证据支持生产性聚集或 AIE。"
    priority: high
  - object_id: I010
    question: "目标亚细胞定位是线粒体、细胞膜、溶酶体、肿瘤膜/CAIX，还是按机制多路线保留？"
    required_expert: "材料专家 + 生物机制专家"
    reason: "不同定位对应不同死亡机制、ROS 半径、实验读出和结构规则。"
    priority: medium
  - object_id: I011
    question: "阳离子强度/脂溶性是否作为可计算设计变量？需要确认毒性、膜破坏和组织分布的上限约束。"
    required_expert: "材料专家 + 计算专家"
    reason: "阳离子和脂溶性有利定位，但可能增加暗毒性或非特异结合。"
    priority: medium
  - object_id: I012
    question: "光热转换效率是否进入优化目标？仅当目标包含 PDT/PTT 协同时建议保留。"
    required_expert: "材料专家"
    reason: "D1 证据强，但并非所有高光敏分子都需要光热效应。"
    priority: medium
  - object_id: I013
    question: "是否把 photopyroptosis efficiency 作为终端性能，还是仅作为免疫治疗场景的机制指标？"
    required_expert: "材料专家 + 免疫/细胞死亡专家"
    reason: "焦亡有免疫激活价值，但也可能与单纯 cytotoxicity 或安全性产生权衡。"
    priority: high
  - object_id: K005
    question: "CA-Re 的 hypoxia-active 机制是否应概括为 type-I 主导、mixed type-I/type-II，还是 membrane-localized lipid peroxidation 主导？"
    required_expert: "光化学专家"
    reason: "wiki 证据显示 singlet oxygen/hydroxyl radical较小而 superoxide/peroxynitrite/lipid peroxidation 更强，需要专家确认机制表述。"
    priority: medium
  - object_id: DATA.comparability
    question: "是否需要建立统一数据表，将分子、细胞/菌株、光照条件、氧条件、浓度、时间和 assay 拆成 long-format records？"
    required_expert: "计算机专家 + 实验专家"
    reason: "进入建模前必须避免把不同条件下的 IC50/MIC/PI 直接混为同一标签。"
    priority: high
  - object_id: SCAFFOLD.routing
    question: "后续候选分子生成优先走哪类优势骨架：锌酞菁/卟啉、D-A/D-B-A 有机 I 型骨架、AIE 膜锚定骨架、CA-Re 类金属配合物，还是并行保留多路线？"
    required_expert: "领域专家 + 计算机专家"
    reason: "不同骨架对应不同 reward 方向，例如普通酞菁偏非聚集和高单线态氧，AIE 体系则可能需要生产性聚集，I 型 D-B-A 则需要电子转移代理指标。"
    priority: high
  - object_id: CP001_CP002
    question: "TD-DFT 吸收 reward 的初始阈值是否采用 lambda_max >= 650 nm、700-800 nm 强奖励、oscillator strength f > 0.05 通过？是否需要按现有光源设备改成 520/525/640 nm 等固定窗口？"
    required_expert: "计算专家 + 实验平台负责人 + 计算机专家"
    reason: "吸收窗口和振子强度是最容易进入迭代优化的 DFT 指标，但阈值必须匹配实验光源和应用场景。"
    priority: high
  - object_id: CP003_CP004
    question: "ISC 代理指标是否采用 min DeltaE(S1-Tn) < 0.4 eV 作为软阈值，并将 SOC 作为同骨架内相对最大化指标？"
    required_expert: "计算化学专家"
    reason: "综述证据支持 S1-Tn 能隙小有利 ISC，但 SOC 的绝对阈值跨骨架不稳定，尤其金属配合物和纯有机分子不可直接比较。"
    priority: high
  - object_id: CP005
    question: "当前优化路线应选择 II 型 PDT 的 E(T1) > 0.98 eV，还是 I 型/低氧 PDT 的 E(T1) < 0.98 eV 或方法特异阈值？是否允许 type-I/type-II 双路线并行但分开打分？"
    required_expert: "领域专家 + 计算专家 + 计算机专家"
    reason: "E(T1) 阈值方向依机制相反，不能在同一候选 reward 中同时作为硬目标。"
    priority: high
  - object_id: CP008
    question: "电子转移自由能 DeltaG_ET 的供体、受体、氧/中继体和溶剂环境如何定义？初始 reward 是否采用 DeltaG_ET < 0 eV，通过区间 -0.1 到 -0.5 eV？"
    required_expert: "计算化学专家 + 光化学专家"
    reason: "Type-I ROS 设计依赖电子转移热力学，但 Rehm-Weller 型计算需要明确参照环境，过强驱动力也可能带来副反应。"
    priority: high
  - object_id: CP009
    question: "阳离子电荷、偶极矩、ESP 和 cLogP/logD 是否作为暗毒性/定位/水相行为的软约束？不同骨架的允许范围如何设定？"
    required_expert: "材料专家 + 计算专家"
    reason: "阳离子和脂溶性可提高定位，但也可能增加非特异结合、暗毒性和聚集风险，不能简单最大化。"
    priority: medium
  - object_id: REWARD.weights
    question: "初始 reward 权重是否按四种场景分别保存：通用高光敏、II 型 PDT、I 型/低氧 PDT、光焦亡免疫治疗？当前项目实际应启用哪一套？"
    required_expert: "计算机专家 + 领域专家"
    reason: "不同场景的 W_abs/W_ISC/W_ROS/W_design/W_risk 权重不同，直接影响候选生成方向。"
    priority: high
  - object_id: COMPUTE.protocol
    question: "DFT/TD-DFT 的计算协议如何固定：泛函、基组、溶剂模型、TDA 与否、构象采样、金属配合物处理、SOC 软件、是否需要 benchmark 已知分子？"
    required_expert: "计算化学专家"
    reason: "同一指标在不同计算协议下可能数值漂移；进入迭代优化前必须固定协议和校准集。"
    priority: high
