concepts:
  - concept_id: C001
    name: "Photodynamic therapy"
    definition: "Therapy using photosensitizing agents followed by light exposure; in cancer PDT, light activation of a photosensitizer produces oxygen radicals or related reactive species that kill cells."
    synonyms: ["PDT", "Photochemotherapy", "Photodynamic Therapy"]
    parent_concept: "Phototherapy / Photochemotherapy"
    ontology_source:
      name: "MeSH / NCI"
      iri_or_url: "http://id.nlm.nih.gov/mesh/D010778; https://www.cancer.gov/about-cancer/treatment/types/photodynamic-therapy"
      version_or_access_date: "MeSH 2026; accessed 2026-07-17"
      mapping_status: exact
    evidence: [E001, E002]
    expert_status: pending
  - concept_id: C002
    name: "Photosensitizing agent"
    definition: "A drug or compound that becomes active after exposure to light and is used to produce a therapeutic photochemical response."
    synonyms: ["photosensitizer", "photosensitizing agent", "PS"]
    parent_concept: "Pharmacologic substance"
    ontology_source:
      name: "MeSH"
      iri_or_url: "https://meshb.nlm.nih.gov/record/ui?ui=D017319"
      version_or_access_date: "MeSH 2026; accessed 2026-07-17"
      mapping_status: close
    evidence: [E003]
    expert_status: pending
  - concept_id: C003
    name: "Reactive oxygen species"
    definition: "Molecules or ions formed by incomplete one-electron reduction of oxygen, including species relevant to PDT such as singlet oxygen, superoxide, hydrogen peroxide, and hydroxyl radical."
    synonyms: ["ROS"]
    parent_concept: "Reactive molecular species"
    ontology_source:
      name: "ChEBI via AmiGO"
      iri_or_url: "CHEBI:26523; https://amigo.geneontology.org/amigo/term/CHEBI:26523"
      version_or_access_date: "accessed 2026-07-17"
      mapping_status: exact
    evidence: [E004]
    expert_status: pending
  - concept_id: C004
    name: "Singlet oxygen"
    definition: "An electronically excited form of molecular oxygen; in PDT literature it is the principal type-II cytotoxic species and is often measured by singlet-oxygen quantum yield."
    synonyms: ["1O2", "O2(1Delta_g)"]
    parent_concept: "Reactive oxygen species"
    ontology_source:
      name: "ChEBI / project wiki"
      iri_or_url: "CHEBI:26689; wiki evidence from 3-PdTPyP and compound 5 pages"
      version_or_access_date: "accessed 2026-07-17"
      mapping_status: close
    evidence: [E005, E006, E011]
    expert_status: pending
  - concept_id: C005
    name: "Quantum yield"
    definition: "Number of defined events per photon absorbed by the system."
    synonyms: ["photochemical yield", "Phi"]
    parent_concept: "Photochemical quantity"
    ontology_source:
      name: "IUPAC Gold Book"
      iri_or_url: "https://doi.org/10.1351/goldbook.Q04991"
      version_or_access_date: "Gold Book online 5.0.0; accessed 2026-07-17"
      mapping_status: exact
    evidence: [E005]
    expert_status: pending
  - concept_id: C006
    name: "Type-I photosensitization"
    definition: "Electron-transfer-dominated photosensitization in which excited photosensitizers generate superoxide and downstream peroxide/hydroxyl-radical chemistry, often less oxygen-dependent than type-II PDT."
    synonyms: ["type-I PDT", "type-I photosensitizer behavior"]
    parent_concept: "Photodynamic mechanism"
    ontology_source:
      name: "Project-level concept from review evidence"
      iri_or_url: "local:Type-I photosensitization"
      version_or_access_date: "2026-07-17"
      mapping_status: local
    evidence: [E007]
    expert_status: pending
  - concept_id: C007
    name: "Photopyroptosis"
    definition: "Light-triggered photosensitizer-induced pyroptotic cell death, often linked in the wiki evidence to ROS-caspase-gasdermin pathways and immunogenic cell-death signals."
    synonyms: ["photoactivated pyroptosis", "photodynamic pyroptosis"]
    parent_concept: "Photodynamic therapy response"
    ontology_source:
      name: "Project-level concept from papers"
      iri_or_url: "local:Photopyroptosis"
      version_or_access_date: "2026-07-17"
      mapping_status: local
    evidence: [E008, E009]
    expert_status: pending

