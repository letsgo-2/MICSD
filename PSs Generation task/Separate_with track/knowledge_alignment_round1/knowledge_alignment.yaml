    parent_concept: photochemical_agent
    ontology_source: {name: "local project concept", iri_or_url: "", version_or_access_date: "2026-10-31"}
    mapping_status: local
    evidence: [E001, E002]
    expert_status: "confirmed_in_principle_from_dialogue"
  - concept_id: C002
    name: reactive oxygen species
    definition: "Molecules or ions formed by the incomplete one-electron reduction of oxygen."
    synonyms: [ROS]
    parent_concept: oxygen_molecular_entity
