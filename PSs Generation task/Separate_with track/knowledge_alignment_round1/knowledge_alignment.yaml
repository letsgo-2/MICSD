round: 1
language: en
project_goal: "Develop candidate molecules with improved photosensitizing performance."
domain: "Photosensitizer and photopyroptosis molecular design"
corpus_count: 47
concepts:
  - concept_id: C001
    name: photosensitizer
    definition: "A light-activated agent whose excited-state chemistry can produce reactive species or other phototherapeutic effects; paper operational definitions are retained per assay."
