selected_metrics:
  - metric_id: E_S1_minus_E_T1
    display_name: "E(S1)-E(T1) / ST gap"
    rank: 1
    role: primary_selected_objective
    direction: minimize_gap_with_context
    implementation_contract:
      predictor_id: kagnn_3out
      output_index: 2
      companion_outputs: {0: S1, 1: T1, 2: ST_Gap}
      runtime_normalization: "1 / (1 + max(raw_ST_gap, 0) / scale)"
      current_scale: 1.0
    threshold: {status: unresolved, rule: "No universal ST-gap cutoff; approve mechanism-specific regime and method calibration first."}
    source_paths:
      predictor_profile: "SDPD/data_preparation/prediction_model/rl_compatible_2025"
      predictor_config: "SDPD/data_preparation/prediction_model/rl_compatible_2025/config/c_path.yaml"
      predictor_checkpoint: "SDPD/data_preparation/prediction_model/pretrained_models/best.pth"
      scoring_code: "SDPD/data_preparation/scoring_strategy/score_function.py"
    status: proposed
  - metric_id: charge
    display_name: "Formal/partial charge state"
    rank: 2
    role: selected_soft_constraint_and_validity_descriptor
    direction: application_specific
    implementation_contract:
      evaluator_id: charge_score
      current_rule: "For one decoration, score positive/negative atom-charge presence; for multiple decorations, score total formal-charge parity."
      required_metadata: [pH, protonation_state, tautomer_policy, counterion_policy, partial_charge_method]
    threshold: {status: unresolved, rule: "No universal charge optimum; define intended compartment and charge-state policy before reward activation."}
    source_paths:
      scoring_code: "SDPD/data_preparation/scoring_strategy/score_function.py"
      rl_config: "SDPD/configs/rl_configs.json"
    status: proposed_proxy_validation_required
  - metric_id: symmetry
    display_name: "Decoration symmetry proxy"
    rank: 3
    role: selected_soft_constraint_and_diversity_descriptor
    direction: maximize_conditionally
    implementation_contract:
      evaluator_id: symmetry_score
      current_rule: "Decoration fragment Morgan-fingerprint identity/pair-pattern rules, not general point-group symmetry."
      required_metadata: [decoration_string, attachment_order, symmetry_definition, conformer_policy]
    threshold: {status: unresolved, rule: "No universal symmetry optimum; approve proxy semantics or replace with a declared graph/point-group descriptor."}
    source_paths:
      scoring_code: "SDPD/data_preparation/scoring_strategy/score_function.py"
      scoring_strategy: "SDPD/data_preparation/scoring_strategy/standard_strategy.py"
    status: proposed_proxy_validation_required
representation:
  molecule: canonical_and_isomeric_SMILES
  fragmentation_rule: RECAP
  required_seed_family: porphyrin
  inherited_policy: "Preserve Round 2 family labels, molecule-condition metadata, edit provenance, uncertainty, and Pareto selection."
interfaces:
  - id: IF-001
    name: sdpd_runtime_predictor
    role: predictor
    status: available_as_repository_contract_not_executed
    entrypoint: "SDPD/data_preparation/prediction_model/rl_compatible_2025/main.py"
    execution_directory: "SDPD/data_preparation/prediction_model/rl_compatible_2025"
    config: "SDPD/data_preparation/prediction_model/rl_compatible_2025/config/c_path.yaml"
    checkpoint: "SDPD/data_preparation/prediction_model/pretrained_models/best.pth"
    input_schema: [SMILES]
    output_schema: [S1, T1, ST_Gap]
    selected_output: ST_Gap
    output_index: 2
    execution_command_documented_only: "cd data_preparation/prediction_model/rl_compatible_2025 && python main.py"
    prohibited_until_confirmation: [execute_training, replace_checkpoint, modify_source_config]
  - id: IF-002
    name: sdpd_metric_scorer
    role: scorer
    status: available_as_source_contract_not_executed
    source: "SDPD/data_preparation/scoring_strategy/score_function.py"
    entrypoint: "multiple_score(smiles_list, weights, config, decorations)"
    input_schema: [SMILES, decorations, weights, predictor_config]
    output_schema: [st_gap, charge_score, symmetry_score, st_gap_raw, decoration_ring_penalty]
    current_component_order: [st_gap, charge_score, symmetry_score]
    current_weights_from_rl_config: [0.1, 0.3, 0.6]
    limitations: ["charge is heuristic", "symmetry is decoration proxy", "ST gap is surrogate", "invalid_value and ring penalty affect reward"]
  - id: IF-003
    name: sdpd_rl_runner
    role: reinforcement_learning_runner
    status: proposed_not_executed
    entrypoint: "SDPD/data_preparation/run_rl.py"
    config: "SDPD/configs/rl_configs.json"
    actor_checkpoint: "SDPD/pretrained_models/rl/best.pt"
    critic_checkpoint: "SDPD/pretrained_models/rl/best.pt"
    output_dir_configured_currently: "SDPD/rl_runs"
    proposed_output_dir: "SDPD/rl_runs/round3_pilot"
    writes_documented: ["diversity_memory.csv", "wandb metrics if enabled"]
    does_not_automatically_write: [updated_actor_checkpoint]
    execution_command_documented_only: "python data_preparation/run_rl.py --config configs/rl_configs.json"
    prohibited_until_confirmation: [execute_rl, alter_checkpoint, alter_hard_constraints, alter_metric_semantics]
  - id: IF-004
    name: copied_configuration_review
    role: parameter_review_adapter
    status: proposed_not_created
    source_config: "SDPD/configs/rl_configs.json"
    proposed_copy: "/Users/jimmmmmies/Desktop/alignment/execution_orchestration_round3/proposed_sdpd_configs/rl_configs_round3.json"
    source_predictor_config: "SDPD/data_preparation/prediction_model/rl_compatible_2025/config/c_path.yaml"
    proposed_predictor_copy: "/Users/jimmmmmies/Desktop/alignment/execution_orchestration_round3/proposed_sdpd_configs/c_path_round3.yaml"
    policy: "Review copies first; do not edit SDPD source configuration without confirmation."
current_sdpd_configuration_snapshot:
  source: "SDPD/configs/rl_configs.json"
  actor: "./pretrained_models/rl/best.pt"
  critic: "./pretrained_models/rl/best.pt"
  n_steps: 1000
  learning_rate: 0.0001
  batch_size: 128
  output_dir: "./rl_runs"
  scoring_function:
    use_kan: true
    weights: [0.1, 0.3, 0.6]
    scale: 1.0
    invalid_value: 0.0
    model_path: "./data_preparation/prediction_model/pretrained_models/best.pth"
  diversity_filter: {name: no_filter_with_penalty, minscore: 0.77, bucket_size: 25, minsimilarity: 0.4}
proposed_procedure:
  status: "proposed_execution_authorization_required"
  phases:
    - phase_id: P0
      name: confirmation_gate
      actions: [approve_metric_semantics, approve_weights, approve_scaffold, approve_output_paths, approve_preflight_scope]
      commands_run: false
    - phase_id: P1
      name: immutable_snapshot_and_review_copy
      actions: [record_git_commit, record_environment, record_checksums, copy_rl_json_to_review_area, copy_predictor_yaml_to_review_area]
      commands_run: false
      outputs: [proposed_sdpd_configs, snapshot_manifest_round3.json]
    - phase_id: P2
      name: metric_preflight
      actions: [fixture_smiles_validation, predictor_contract_check, score_component_check, weight_order_check, invalid_value_check, checkpoint_identity_check]
      commands_run: false
      outputs: ["preflight_round3/preflight_report.json", "preflight_round3/metric_records.jsonl"]
    - phase_id: P3
      name: controlled_rl_pilot
      actions: [approved_porhyrin_scaffold, fixed_budget, fixed_weights, record_metric_components, record_failures, export_diversity_memory]
      commands_run: false
      outputs: ["SDPD/rl_runs/round3_pilot/diversity_memory.csv", "SDPD/rl_runs/round3_pilot/run.log"]
    - phase_id: P4
      name: review_and_iteration
      actions: [check_metric_dominance, check_invalid_rate, check_scaffold_coverage, review_proxy_behavior, approve_parameter_changes]
      commands_run: false
      outputs: ["round3_pilot_review.md", "round3_parameter_change_log.jsonl"]
