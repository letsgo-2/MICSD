    category: protocol
    question: What route-level review standard is required to label a finalist synthetically feasible?
    affected_ids: [route_feasibility_review]
    recommendation: Define route evidence, building-block availability checks, number/risk of steps, reviewer and confidence labels; distinguish unknown from infeasible.
    evidence_refs: [performance_evaluation_report_round3.md]
    required_expert_ids: [materials_scientist, synthetic_chemist]
    priority: high
    blocking: true
    status: open
  - issue_id: PE3-003
    category: metric
    question: How should overlap between SA score's symmetry contribution and the separate decoration-symmetry objective be handled?
    affected_ids: [SA_Score, symmetry]
    recommendation: Keep raw metrics separate; quantify correlation and conduct ablation before assigning joint reward weights.
    evidence_refs: [../meloculardftcal/04_data_processing/sascorer.py, ../performance_evaluation_round2/performance_evaluation_round2.yaml]
    required_expert_ids: [materials_scientist, computer_expert]
