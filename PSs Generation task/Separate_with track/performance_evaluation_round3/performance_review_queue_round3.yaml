    blocking: false
    status: open
  - issue_id: PE3-004
    category: provenance
    question: Is the SA score implementation and fragment-score file version/hash documented for both cohort CSVs and the core data?
    affected_ids: [PR3-SA-core, PR3-SA-cohort-round1, PR3-SA-cohort-round2]
    recommendation: Record implementation commit/hash, fragment-score data hash and scoring timestamp; recompute only in an isolated, versioned audit if provenance is insufficient.
