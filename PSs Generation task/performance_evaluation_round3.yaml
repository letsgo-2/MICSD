synthesizability_constraint:
  primary_metric:
    column: SA_Score
    direction: minimize
    interpretation: computational synthetic-accessibility proxy, not a route guarantee
  secondary_metric:
    column: Molecular_Weight
    direction: minimize_or_cap
    interpretation: practicality proxy for large photosensitizer candidates
  proposed_default_rule:
    expression: Imaginary == "No" AND SA_Score <= 6.5 AND Molecular_Weight <= 1100
    status: initial_round3_recommendation_pending_materials_expert_confirmation
  preferred_tier:
    expression: SA_Score <= 6.0
    use: annotate_as_more_synthesizable_when_photophysical_metrics_remain_competitive
  relaxed_tier:
    expression: SA_Score <= 7.0 AND Molecular_Weight <= 1200
    use: retain_broader_candidate_pool_for_sensitivity_or_exception_review
  exception_policy:
    expression: SA_Score > 6.5 OR Molecular_Weight > 1100
    requirement: explicit_materials_expert_route_review_before_promotion

