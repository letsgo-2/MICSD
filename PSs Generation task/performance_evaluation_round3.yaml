updated_ranking_workflow:
  - step_id: PE-R3-W001
    action: retain only validated minima for final ranking
    rule: Imaginary == "No"
  - step_id: PE-R3-W002
    action: apply default synthesizability gate
    rule: SA_Score <= 6.5
  - step_id: PE-R3-W003
    action: apply molecular-size practicality cap
    rule: Molecular_Weight <= 1100
  - step_id: PE-R3-W004
    action: apply selected PDT wavelength window
    rule_options:
      broad: 600 <= S1_wavelength_nm <= 800
      preferred: 650 <= S1_wavelength_nm <= 750
  - step_id: PE-R3-W005
    action: apply ISC proximity filter
    rule: min_positive_S1-Ti < 0.4
  - step_id: PE-R3-W006
    action: compute constrained Pareto front
    objectives:
      - {column: min_positive_S1-Ti, direction: minimize}
      - {column: max_SOCME_S1_Ti_value, direction: maximize}
      - {column: max_SOCME_over_deltaE_S1_Ti_value, direction: maximize}
  - step_id: PE-R3-W007
    action: select diverse strict shortlist and expert-exception shortlist
    method: fingerprint_diversity_sampling_after_constraints

updated_recommendations:
  - recommendation_id: PE-R3-R001
    action: Add SA_Score <= 6.5 as the default hard gate for initial shortlist generation.
    basis: 143 of 191 no-imaginary candidates pass, preserving enough search space while removing high-complexity tail.
  - recommendation_id: PE-R3-R002
    action: Use SA_Score <= 6.0 as a preferred annotation tier rather than a mandatory first filter.
    basis: only 43 of 191 no-imaginary candidates pass, so it may be too restrictive.
  - recommendation_id: PE-R3-R003
    action: Pair SA Score with Molecular_Weight <= 1100 for strict shortlist generation.
    basis: 120 candidates pass no-imaginary, SA<=6.5, and MW<=1100.
  - recommendation_id: PE-R3-R004
    action: Keep a route-review exception list for high-performance candidates that fail SA or MW gates.
    basis: SA Score is a proxy and cannot replace expert retrosynthetic review.
  - recommendation_id: PE-R3-R005
    action: Add synthesizability as a SDPD reward penalty or post-generation filter in the next execution round after threshold confirmation.
    basis: materials expert requested synthesizability and v22 provides complete SA Score values.

