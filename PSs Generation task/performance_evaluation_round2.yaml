    source_type: workflow_interface
    source_ref: meloculardftcal/AGENT_INTERFACE_EN.md
    extracted_claim: meloculardftcal provides a staged RDKit/ORCA/Slurm/statistics/plotting workflow with stable stage IDs and machine-readable query commands.
    verification_status: read
  - evidence_id: PE-R2-E002
    source_type: metrics_report
    source_ref: meloculardftcal/reports/pic16_s1/metrics.json
    extracted_claim: pic16_s1 contains 222 complete v22 rows, 191 no-imaginary minima, 2 two-objective Pareto rows, and 14 three-objective Pareto rows.
    verification_status: parsed
  - evidence_id: PE-R2-E003
    source_type: environment_report
    source_ref: meloculardftcal/reports/environment.json
    extracted_claim: local environment has Python/RDKit/Open Babel data tools, but sbatch, squeue, and ORCA are unavailable because ORCA_BIN is not set.
