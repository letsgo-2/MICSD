next_step_recommendations:
  - recommendation_id: PE-R2-R001
    action: Filter final ranking to records with Imaginary == No.
    basis: 31 of 222 records have imaginary frequencies.
    target: ranking_and_shortlist_scripts
  - recommendation_id: PE-R2-R002
    action: Use Pareto selection over min_positive_S1-Ti, max_SOCME_S1_Ti_value, and max_SOCME_over_deltaE_S1_Ti_value instead of an undocumented scalar.
    basis: meloculardftcal optimization interface and Pareto metrics.
    target: 05_analysis/plotters and shortlist generation
  - recommendation_id: PE-R2-R003
    action: Retune LogP/TPSA windows or add solubility/aggregation pressure to next molecule generation.
    basis: zero hits in default LogP/TPSA window and median LogP 14.08.
    target: SDPD reward constraints or post-generation filters
  - recommendation_id: PE-R2-R004
    action: Add explicit red-shift pressure if 650-750 nm is the preferred PDT window.
    basis: only 38 of 222 candidates fall in 650-750 nm.
    target: molecular design rules and reward targets
  - recommendation_id: PE-R2-R005
    action: Preserve raw ORCA logs and write reports/runs/<run_id>.json for future production batches.
    basis: normal termination counts are null in committed metrics.
    target: workflow execution policy
  - recommendation_id: PE-R2-R006
    action: Join SDPD diversity_memory outputs to meloculardftcal v22 descriptors for KA-GNN and reward calibration.
    basis: no matched SDPD-vs-ORCA calibration table was found.
    target: model calibration analysis

