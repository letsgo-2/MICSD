toolchain:
  repository:
    name: meloculardftcal
    url: https://github.com/letsgo-2/meloculardftcal.git
    path_policy: repository_relative
    default_batch: pic16
    default_display_label: S1
  software:
    python_required: '>=3.9'
    python_environment_reported: 3.12.2
    orca_parser_target: 6.0.1
    orca_reference_build: linux_x86-64_shared_openmpi416_avx2
    mpi_reference: OpenMPI 4.1.6
    ucx_reference: 1.15.0
    scheduler: Slurm
    structure_generation: Open Babel obabel
    cheminformatics: RDKit
    data_and_plots: [NumPy, pandas, SciPy, Matplotlib, Seaborn]
    chemical_space_plots: [scikit-learn, UMAP]
  local_environment_report:
    path: meloculardftcal/reports/environment.json
    python: 3.12.2
    rdkit: 2025.9.3
    numpy: 1.26.4
    pandas: 2.2.2
    scipy: 1.15.2
    matplotlib: 3.8.4
    seaborn: 0.13.2
    scikit_learn: 1.4.2
    umap_learn: null
    openbabel: Open Babel 3.1.0
    mpirun: Open MPI 4.0.3
    sbatch_available: false
    squeue_available: false
    orca_available: false
    orca_unavailable_reason: ORCA_BIN is not set

scheduler_parameters:
  partition: amd_512q
  nodes: 1
  opt_mpi_ranks: 64
  td_mpi_ranks: 32
  omp_threads_per_rank: 1
  maxcore_mb_per_rank: 3000
  max_jobs_per_user: 20
  poll_interval_seconds: 1800
  cluster_private_config: meloculardftcal/config/cluster.env
  cluster_private_config_exists_in_checkout: false

quantum_profiles:
  opt_standard:
    generator: 01_structure_preparation/gjf_to_inp.sh
    method: B3LYP
    basis: def2-SVP
    tasks: [Opt, Freq]
    keywords: [RIJCOSX, CPCM(Water)]
    mpi_ranks: 64
    maxcore_mb_per_rank: 3000
  opt_heavy_zora:
    generator: 01_structure_preparation/gjf_to_inpp13.sh
    method: PBE0
    basis: ZORA-def2-TZVP
    auxiliary_basis: SARC/J
    tasks: [Opt, Freq]
    keywords: [D3BJ, ZORA, RIJCOSX, TightSCF, CPCM(Water)]
    mpi_ranks: 64
    maxcore_mb_per_rank: 3000
  td_standard:
    generator: 01_structure_preparation/gjf_to_inptd.sh
    method: wB97X-D3
    basis: def2-TZVP
    keywords: [RIJCOSX, TightSCF, CPCM(Water)]
    nroots: 10
    triplets: true
    dosoc: true
    guess: MORead
    mpi_ranks: 32
    maxcore_mb_per_rank: 3000
  td_heavy_zora:
    generator: 01_structure_preparation/gjf_to_inptdp13.sh
    method: wB97X-D3
    basis: ZORA-def2-TZVP
    auxiliary_basis: SARC/J
    keywords: [ZORA, RIJCOSX, RI-SOMF(1X), TightSCF, CPCM(Water)]
    nroots: 10
    triplets: true
    dosoc: true
    guess: MORead
    mpi_ranks: 32
    maxcore_mb_per_rank: 3000

workflow_stages:
  - {stage_id: S00_PREFLIGHT, entrypoint: 07_validation/check_environment.py, external_mutation: false}
  - {stage_id: S10_STRUCTURE, entrypoint: 01_structure_preparation/convertInputs.py, external_mutation: false}
  - {stage_id: S20_OPT_GENERATE, entrypoint: 01_structure_preparation/gjf_to_inp.sh, external_mutation: false}
  - {stage_id: S21_OPT_SUBMIT, entrypoint: 02_cluster_execution/suboptsbatch.sh, external_mutation: true}
  - {stage_id: S22_OPT_QC, entrypoint: 02_cluster_execution/find_missing_opt_ids.sh, external_mutation: false}
  - {stage_id: S30_TD_GENERATE, entrypoint: 01_structure_preparation/gjf_to_inptd.sh, external_mutation: false}
  - {stage_id: S31_TD_SUBMIT, entrypoint: 02_cluster_execution/subtdsbatch.sh, external_mutation: true}
  - {stage_id: S32_TD_QC, entrypoint: 02_cluster_execution/find_missing_td_ids.sh, external_mutation: false}
  - {stage_id: S40_PARSE_OPT, entrypoint: 03_result_parsing/parse_orca_opt.py, external_mutation: false}
  - {stage_id: S41_PARSE_TD, entrypoint: 03_result_parsing/parse_orca_td_socv2.py, external_mutation: false}
  - {stage_id: S42_MERGE_DFT, entrypoint: 03_result_parsing/merge_dft_csv.py, external_mutation: false}
  - {stage_id: S50_MERGE_SOURCE, entrypoint: 04_data_processing/merge_summary.py, external_mutation: false}
  - {stage_id: S51_ENRICH, entrypoint: 04_data_processing/addrdkit.py, external_mutation: false}
  - {stage_id: S60_METRICS, entrypoint: 07_validation/collect_metrics.py, external_mutation: false}
  - {stage_id: S70_ANALYZE, entrypoint: 05_analysis/plotters/plot_pareto_s1ti_socmegap.py, external_mutation: false}
  - {stage_id: S80_VISUALIZE, entrypoint: 06_visualization/generate_molecule_images_with_props.py, external_mutation: false}

