project:
  stage: performance_evaluation
  evaluation_round: round1
  language: en-US
  generated: '2026-07-25'
  status: workflow_and_analysis_plan_no_new_execution
  goal: Evaluate generated photosensitizer molecules and the SDPD model using RDKit, ORCA DFT/TD-DFT, Slurm execution, statistics, and plotting.
  input_files:
    knowledge_alignment_round2:
      - knowledge_alignment_round2_report.md
      - knowledge_alignment_round2.yaml
      - expert_review_queue_round2.yaml
    execution_orchestration_round3:
      - execution_orchestration_report_round3.md
      - execution_orchestration_round3.yaml
      - execution_review_queue_round3.yaml
    project_directory: SDPD
  execution_boundary: No SDPD RL, RDKit batch, ORCA calculation, Slurm submission, or statistical analysis was executed in this performance-evaluation round.

evaluation_objects:
  - object_id: PE-R1-O001
    name: SDPD generated candidate molecules
    primary_source: SDPD/rl_runs/<timestamp>/diversity_memory.csv
    required_columns: [SMILES, Scaffold, Step, st_gap, st_gap_raw, total_score]
    status: requires_new_or_approved_run_output
  - object_id: PE-R1-O002
    name: Existing SDPD example run
    primary_source: SDPD/rl_runs/20251014-113340/diversity_memory.csv
    status: dry_run_parser_and_plot_validation_source_unless_approved_as_baseline
  - object_id: PE-R1-O003
    name: SDPD reward model
    primary_source: SDPD/configs/rl_configs.json
    reward_formula: 0.1*st_gap_score + 0.3*charge_score + 0.6*symmetry_score
    status: active_round3_contract
  - object_id: PE-R1-O004
    name: KA-GNN ST-gap predictor
    primary_source: SDPD/data_preparation/prediction_model/pretrained_models/best.pth
    outputs: [S1, T1, ST_Gap]
    status: checkpoint_approval_required
  - object_id: PE-R1-O005
    name: ORCA DFT/TD-DFT result set
    primary_source: analysis_round1/orca_outputs_round1
    status: planned_not_generated

metric_layers:
  sdpd_runtime:
    metrics:
      - st_gap
      - st_gap_raw
      - total_score
      - Step
      - duplicate_flag
      - ring_penalty_pass
    reward_weights:
      order: [ES1-ET1, charge, symmetric]
      values: [0.1, 0.3, 0.6]
    gates:
      minscore: 0.77
      invalid_value: 0.0
      max_decoration_ring_count: 3
  rdkit:
    descriptors:
      - validity
      - canonical_smiles
      - duplicate_flag
      - formal_charge
      - ring_count
      - aromatic_ring_count
      - heavy_atom_count
      - exact_molecular_weight
      - clogp
      - tpsa
      - rotatable_bonds
      - hba
      - hbd
      - qed
      - morgan_fingerprint
      - bemis_murcko_scaffold
      - aggregation_risk_proxy
  orca:
    descriptors:
      - geometry_convergence
      - td_dft_convergence
      - excitation_energies_ev
      - absorption_wavelength_nm
      - oscillator_strength
      - T1_S0_gap_ev
      - minimum_S1_Tn_gap_ev
      - SOC_S1_Tn_cm_minus_1
      - HOMO_ev
      - LUMO_ev
      - redox_proxy
      - DeltaG_ET

thresholds:
  absorption_wavelength_nm:
    high_score_range: [600, 800]
    preferred_initial_range: [650, 750]
    status: literature_supported_initial_threshold
  oscillator_strength:
    rule: rank_normalize_within_scaffold_and_penalize_near_zero_target_transition
    status: no_universal_absolute_threshold
  T1_S0_gap_ev:
    type_II_favorable_minimum: 0.98
    type_II_conservative_solution_threshold: 1.13
    type_I_EET_blocking_maximum: 0.98
    status: branch_specific_threshold_requires_mechanism_confirmation
  minimum_S1_Tn_gap_ev:
    favorable_maximum: 0.4
    status: heuristic_must_be_combined_with_SOC
  DeltaG_ET:
    favorable_sign: negative
    status: donor_acceptor_reference_and_solvent_required

workflow:
  - step_id: PE-R1-W001
    name: candidate_collection
    inputs: [SDPD/rl_runs/<timestamp>/diversity_memory.csv]
    outputs: [analysis_round1/candidates_clean_round1.csv]
    required_actions:
      - confirm the run directory explicitly
      - parse required SDPD columns
      - canonicalize SMILES with RDKit
      - preserve raw SMILES and source row identifiers
  - step_id: PE-R1-W002
    name: rdkit_fast_evaluation
    inputs: [analysis_round1/candidates_clean_round1.csv]
    outputs:
      - analysis_round1/candidate_qc_round1.csv
      - analysis_round1/rdkit_descriptors_round1.csv
      - analysis_round1/orca_shortlist_round1.csv
    required_actions:
      - compute structural descriptors
      - flag invalid molecules and duplicates
      - compute Morgan fingerprint diversity
      - triage 20-50 candidates for ORCA first batch
  - step_id: PE-R1-W003
    name: orca_input_generation
    inputs: [analysis_round1/orca_shortlist_round1.csv]
    outputs:
      - analysis_round1/orca_inputs_round1/*.inp
      - analysis_round1/orca_inputs_round1/input_list.txt
    required_actions:
      - generate ETKDGv3 conformers
      - MMFF94 optimize where supported, otherwise UFF with flag
      - write ORCA input files with locked method parameters
      - require manual review for metal-containing molecules
  - step_id: PE-R1-W004
    name: slurm_orca_execution
    inputs: [analysis_round1/orca_inputs_round1/input_list.txt]
    outputs: [analysis_round1/orca_outputs_round1]
    required_actions:
      - submit Slurm job array after cluster parameters are confirmed
      - collect output, error logs, and convergence status
      - never overwrite previous ORCA outputs
  - step_id: PE-R1-W005
    name: orca_result_parsing
    inputs: [analysis_round1/orca_outputs_round1]
    outputs: [analysis_round1/orca_summary_round1.csv]
    required_actions:
      - extract excitation energies, wavelengths, oscillator strengths, triplet states, SOC where available
      - record method, basis, solvent, charge, multiplicity, and convergence flags
  - step_id: PE-R1-W006
    name: statistical_analysis
    inputs:
      - analysis_round1/rdkit_descriptors_round1.csv
      - analysis_round1/orca_summary_round1.csv
    outputs:
      - analysis_round1/model_calibration_round1.csv
      - analysis_round1/shortlist_round1.csv
    required_actions:
      - compute descriptive statistics
      - compute correlations and calibration metrics
      - stratify errors by scaffold, charge, symmetry, ring count, and size
      - generate cross-domain shortlist
  - step_id: PE-R1-W007
    name: plotting
    inputs:
      - analysis_round1/rdkit_descriptors_round1.csv
      - analysis_round1/orca_summary_round1.csv
      - analysis_round1/model_calibration_round1.csv
    outputs:
      - analysis_round1/figures_round1/*.png
      - analysis_round1/figures_round1/figures_manifest_round1.yaml
    required_actions:
      - run the plotting script with explicit file paths
      - include threshold bands and input table hashes

tool_parameters:
  sdpd:
    repository_root: /Users/jimmmmmies/Desktop/alignment/SDPD
    entrypoint: python data_preparation/run_rl.py
    config_file: configs/rl_configs.json
    n_steps: 1000
    batch_size: 128
    learning_rate: 0.0001
    learning_strategy: dap
    sigma: 120
    weights_order: [ES1-ET1, charge, symmetric]
    weights: [0.1, 0.3, 0.6]
    scale: 1.0
    minscore: 0.77
    output_root: ./rl_runs
  rdkit:
    canonicalization: Chem.MolToSmiles(mol, canonical=True, isomericSmiles=True)
    fingerprint:
      type: Morgan
      radius: 2
      n_bits: 2048
      similarity: Tanimoto
    conformers:
      method: ETKDGv3
      max_conformers_per_molecule: 50
      force_field_preference: [MMFF94, UFF]
  orca:
    organic_geometry_default: '! B3LYP D3BJ def2-SVP CPCM(water) Opt TightSCF'
    organic_tddft_default: '! CAM-B3LYP def2-SVP CPCM(water) TightSCF'
    triplet_default: '! CAM-B3LYP def2-SVP CPCM(water) TightSCF TDA'
    nroots_singlet: 10
    nroots_triplet: 10
    nprocs: 16
    maxcore_mb_per_core: 3000
    metal_protocol_status: expert_confirmation_required
  slurm:
    job_name: ps_orca_r1
    nodes: 1
    ntasks: 1
    cpus_per_task: 16
    memory: 64G
    walltime: '24:00:00'
    array_template: 0-49%10
    output_log: logs/orca_%A_%a.out
    error_log: logs/orca_%A_%a.err
    cluster_specific_fields: [partition, module_or_orca_path, scratch_policy, max_array_concurrency]

planned_tables:
  - analysis_round1/candidate_qc_round1.csv
  - analysis_round1/rdkit_descriptors_round1.csv
  - analysis_round1/orca_shortlist_round1.csv
  - analysis_round1/orca_summary_round1.csv
  - analysis_round1/model_calibration_round1.csv
  - analysis_round1/shortlist_round1.csv

plotting_script_plan:
  path: analysis_round1/plot_performance_round1.py
  cli_arguments:
    - --rdkit
    - --orca
    - --calibration
    - --outdir
  planned_figures:
    - score_distributions_round1.png
    - rdkit_qc_summary_round1.png
    - diversity_umap_round1.png
    - score_vs_descriptors_round1.png
    - orca_absorption_round1.png
    - s1_tn_soc_round1.png
    - kagnn_vs_orca_stgap_round1.png
    - ranking_overlap_round1.png
    - shortlist_radar_round1.png
  manifest: analysis_round1/figures_round1/figures_manifest_round1.yaml

blockers:
  - confirm whether SDPD/rl_runs/20251014-113340/diversity_memory.csv is a formal baseline or only an example output
  - confirm the active SDPD reward weights [0.1, 0.3, 0.6]
  - approve the runtime KA-GNN checkpoint
  - provide ORCA version and cluster module/path
  - confirm solvent, functionals, basis sets, charge/multiplicity rules, and metal treatment
  - provide Slurm partition, concurrency, wall-time, memory, and scratch policy
