model_interfaces:
  - model_id: MODEL-001
    name: "RDKit SMILES validator"
    role: constraint_checker
    status: proposed
    input_schema: {smiles: string}
    output_schema: {valid: boolean, canonical_smiles: string}
    supported_metrics: [M-VALID]
    evidence_refs: [RDKit-DOC]
  - model_id: MODEL-002
    name: "RDKit RECAP fragmenter"
    role: constraint_checker
    status: proposed
    input_schema: {smiles: string, min_fragment_size: integer}
    output_schema: {fragment_tree: object, leaf_fragments: list}
    supported_metrics: [M-SA]
    evidence_refs: [RDKit-DOC]
  - model_id: MODEL-003
    name: "Porphyrin scaffold checker"
    role: constraint_checker
    status: proposed
    input_schema: {smiles: string, scaffold_smarts: string}
    output_schema: {has_scaffold: boolean}
    supported_metrics: [M-SCAFFOLD]
    evidence_refs: [USER-PORPHYRIN]
  - model_id: MODEL-004
    name: "SMILES/RECAP RL generator"
    role: generator
    status: proposed
    input_schema: {prior_model: string, fragment_vocabulary: list, reward_profile: string}
    output_schema: {candidate_smiles: list, trajectories: object}
    supported_metrics: [M-VALID, M-SCAFFOLD, M-SA]
    evidence_refs: [RL-REINVENT-REF, RL-FRAGMENT-REF]
  - model_id: MODEL-005
    name: "Cheap descriptor evaluator"
    role: constraint_checker
    status: proposed
    input_schema: {smiles: string}
    output_schema: {mw: number, logp: number, tpsa: number, formal_charge: number, symmetry_score: number, sa_score: number, homo_lumo_proxy: number}
    supported_metrics: [M-HL-GAP, M-CHARGE, M-SYMMETRY, M-SA, M-LOGP, M-TPSA, M-MW]
    evidence_refs: [PORPHYRIN-CHARGE-LOGP, STANDARD-DEVELOPABILITY]
  - model_id: MODEL-006
    name: "Excited-state DFT/TD-DFT evaluator"
    role: physics_calculator
    status: proposed
    input_schema: {smiles: string, conformer: string, method: object}
    output_schema: {socme: number, es1_eV: number, deltae_s1_t1_eV: number, homo_lumo_gap_eV: number}
    supported_metrics: [M-SOCME, M-DELTAE-S1-T1, M-ES1, M-HL-GAP]
    evidence_refs: [PORPHYRIN-PDI-SOCME, ORGANIC-PS-REVIEW]

reward_profiles:
  round2_photophysics_centered_porphyrin:
    status: proposed_primary_profile
    gates:
      - {metric_id: M-VALID, behavior: score_zero_if_failed}
      - {metric_id: M-SCAFFOLD, behavior: score_zero_if_failed}
    components:
      - {metric_id: M-SOCME, weight: 0.22, transform: sigmoid_rank_with_soft_reference_0_24}
      - {metric_id: M-DELTAE-S1-T1, weight: 0.20, transform: favorable_low_gap_not_unbounded}
      - {metric_id: M-ES1, weight: 0.18, transform: target_visible_nir_window}
      - {metric_id: M-HL-GAP, weight: 0.10, transform: rank_or_target_range}
      - {metric_id: M-CHARGE, weight: 0.08, transform: target_range}
      - {metric_id: M-SYMMETRY, weight: 0.05, transform: moderate_regularizer}
      - {metric_id: M-SA, weight: -0.07, transform: penalty_for_poor_accessibility}
      - {metric_id: M-LOGP, weight: -0.04, transform: penalty_outside_moderate_range}
      - {metric_id: M-TPSA, weight: -0.03, transform: penalty_outside_moderate_range}
      - {metric_id: M-MW, weight: -0.03, transform: penalty_for_size_growth}
    aggregation: weighted_sum_after_hard_gates
    decision_status: proposed

execution_workflow:
  stages:
    - stage_id: STAGE-0
      name: "Input and scaffold normalization"
      steps:
        - "Load round1 orchestration artifacts and round2 metric priorities."
        - "Load approved porphyrin scaffold representation."
        - "Canonicalize and sanitize seed SMILES."
      outputs: ["seed_registry"]
    - stage_id: STAGE-1
      name: "Cheap developability prefilter"
      steps:
        - "Apply scaffold gate."
        - "Compute MW, logP, TPSA, charge, SA, and optional symmetry proxy."
        - "Drop candidates outside hard invalidity or expert-defined impossible ranges."
      outputs: ["prefiltered_pool"]
    - stage_id: STAGE-2
      name: "Electronic-structure main evaluation"
      steps:
        - "Compute Es1 and HOMO-LUMO gap for surviving candidates."
        - "Compute DeltaE_S1_T1."
        - "Compute SOCME for top candidates or calibrated batches."
      outputs: ["photophysics_scored_pool"]
    - stage_id: STAGE-3
      name: "RL policy update"
      steps:
        - "Use the round2 photophysics-centered reward profile."
        - "Bias actions toward donor/acceptor, conjugation, charge, and peripheral substitutions."
        - "Keep RECAP-compatible edits where possible."
      outputs: ["updated_agent"]
    - stage_id: STAGE-4
      name: "Expert review and threshold tightening"
      steps:
        - "Review high-scoring candidates and failures with materials and computation experts."
        - "Tighten SOCME, DeltaE_S1_T1, logP, TPSA, MW, and SA ranges."
      outputs: ["approved_thresholds_next_round"]

evidence:
  - evidence_id: RDKit-DOC
    source_type: documentation
    source_name: "RDKit documentation"
    identifier_or_url: "https://github.com/rdkit/rdkit/blob/master/Docs/Book/source/rdkit.Chem.Recap.md"
    content_summary: "RECAP decomposition and molecule sanitization interfaces."
  - evidence_id: RL-REINVENT-REF
    source_type: literature_and_software
    source_name: "REINVENT and REINVENT 4"
    identifier_or_url: "https://doi.org/10.1186/s13321-017-0235-x ; https://doi.org/10.1186/s13321-024-00812-5"
    content_summary: "SMILES RL, staged learning, multi-component scoring."
  - evidence_id: RL-FRAGMENT-REF
    source_type: literature
    source_name: "Fragment-based RL references"
    identifier_or_url: "https://doi.org/10.1021/acs.jcim.3c00735 ; fragment-based RL references from web search"
    content_summary: "Fragment-level RL helps preserve chemical realism and synthesizability."
  - evidence_id: PORPHYRIN-PDI-SOCME
    source_type: literature
    source_name: "Porphyrin photosensitizer molecules as effective medicine candidates for PDT"
    identifier_or_url: "https://pubs.rsc.org/en/content/articlelanding/2024/ra/d4ra05585c"
    content_summary: "SOCME, HOMO-LUMO gap, excitation energies, S1-T1, porphyrin-PDI electronic structure design evidence."
  - evidence_id: PORPHYRIN-CHARGE-LOGP
    source_type: literature
    source_name: "Photodynamic Inactivation of Bacteria with Porphyrin Derivatives"
    identifier_or_url: "https://www.mdpi.com/1422-0067/21/22/8716"
    content_summary: "Charge distribution, symmetry effects, and logP relevance in porphyrin photosensitizer behavior."
  - evidence_id: ORGANIC-PS-REVIEW
    source_type: review
    source_name: "Organic photosensitizers: from molecular design to phototheranostics"
    identifier_or_url: "https://pubs.rsc.org/en/content/articlelanding/2025/cs/d5cs00599j"
    content_summary: "SOC and DeltaEST jointly control ISC; smaller DeltaEST or stronger SOC promote ROS generation."
  - evidence_id: STANDARD-DEVELOPABILITY
    source_type: general_rule
    source_name: "Standard developability descriptors"
    identifier_or_url: "local:STANDARD-DEVELOPABILITY"
    content_summary: "MW, TPSA, SA, and logP are standard practicality constraints and should remain secondary to core photophysics."

blocking_issues:
  - "Exact operational definition of symmetry_score is not yet approved."
  - "Target ranges for SA, logP, TPSA, and MW in porphyrin-like photosensitizers are not yet approved."
  - "SOCME reference value 0.24 cm^-1 is literature-specific and must not be treated as universal until approved."
  - "Need expert confirmation on whether DeltaE_S1_T1 should be optimized toward a bounded window rather than simple minimization."

expert_feedback_reconciliation:
  annotation_date: '2026-10-30'
  annotation_type: retrospective_dialogue_based_status_reconciliation
  scope: General knowledge, task inputs, candidate metrics, selected optimization metrics and constraint requirements
    may be confirmed at their own stage. This is retrospective interpretation, not newly completed independent itemwise
    validation.
  source_file: multi_round_dialogue_example_EN.txt
  source_sha256: ebb57f5513ccd2ee131a9971088e81acaa8e6b610f46e7df5afea5890dbc12d8
  itemwise_expert_verification_completed: false
  numerical_values_units_and_thresholds_certified: false
  execution_authorized_by_this_annotation: false
  note: No original-status fields or new original-file backup are retained in this update. Source dialogue and confirmation
    scope remain recorded. Unanswered review items, quantitative settings, checkpoint approval and run authorization
    remain unresolved.
  feedback_records:
  - feedback_id: PS-EO-R1-INPUTS
    source_file: multi_round_dialogue_example_EN.txt
    source_line: 12
    source_excerpt: 'Please run the Execution Orchestration Skill. Based on the three output files from the knowledge-alignment
      stage, design a task-execution workflow. Provide necessary recommendations, especially recommendations for metric
      ranking and corresponding threshold guidance, preferably supported by evidence. The materials expert provides the
      following information: molecules are generally represented using SMILES, RECAP is used as the molecular fragmentation
      rule, and porphyrin is a commonly used scaffold. The computer expert intends to construct a reinforcement-learning
      framework for molecular-generation optimization. Add the suffix `round1` to the output filenames.'
    attributed_expert_role: materials expert and computer expert
    action: provide_task_inputs
    confirmed_scope: SMILES representation; RECAP fragmentation rule; porphyrin as a common scaffold; intention to use
      reinforcement learning.
    not_confirmed: No approval of exact scaffold SMARTS, allowed variants, Type-II-only routing, specific algorithm,
      validator implementation, SA cutoff or execution.
    original_expert_review_date: null
    provenance: User-provided dialogue example; no independent signature or original execution log is supplied.
  - feedback_id: PS-EO-R2-METRICS
    source_file: multi_round_dialogue_example_EN.txt
    source_line: 15
    source_excerpt: 'The materials scientist requests an updated priority ranking for the following metrics: SOCME, HOMO–LUMO
      gap, E(S1)−E(T1), E(S1), charge, symmetry, SA, logP, TPSA, and molecular weight (MW). Update the output files and
      add the suffix `round2`.'
    attributed_expert_role: materials scientist
    action: request_metric_reprioritization
    confirmed_scope: The ten named metrics must be considered in the revised priority organization.
    not_confirmed: No explicit approval of the generated numerical ranks, objective roles, exact definitions, weights
      or thresholds.
    original_expert_review_date: null
