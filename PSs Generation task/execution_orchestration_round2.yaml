    ranking_basis: ["Fast electronic proxy", "useful before expensive excited-state calculations"]
    direction: context_dependent
    threshold: {value: "ranking only"}
    evaluator_id: MODEL-005
    decision_status: proposed
    evidence_refs: [PORPHYRIN-PDI-SOCME]
    expert_feedback_refs: [PS-EO-R2-METRICS]
  - metric_id: M-CHARGE
    final_role: soft_constraint
    rank: 7
    ranking_basis: ["Important for uptake, amphiphilicity, localization, and biointeraction"]
    direction: target_range
    threshold: {value: "avoid extremes", status: unresolved}
    evaluator_id: MODEL-005
    decision_status: proposed
    evidence_refs: [PORPHYRIN-CHARGE-LOGP]
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
  - metric_id: M-SYMMETRY
    final_role: design_regularizer
    rank: 8
    ranking_basis: ["Can modulate charge distribution and conjugation, but weaker evidence than core photophysics"]
    direction: context_dependent
    threshold: {value: "moderate regularizer"}
    evaluator_id: MODEL-005
    decision_status: proposed
    evidence_refs: [PORPHYRIN-CHARGE-LOGP]
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
  - metric_id: M-SA
    final_role: soft_constraint
