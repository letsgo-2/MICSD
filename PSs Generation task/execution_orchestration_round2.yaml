project:
  orchestration_round: round2
  language: en-US
  based_on:
    - execution_orchestration_report_round1.md
    - execution_orchestration_round1.yaml
    - execution_review_queue_round1.yaml
  goal: "Update the RL execution workflow by strongly prioritizing the materials expert metrics: SOCME, HOMO-LUMO, Es1-Et1, Es1, charge, symmetry, SA, logP, TPSA, and WM."
  molecular_representation: SMILES
  fragmentation_rule: RECAP
  scaffold_policy: porphyrin_scaffold_first
  status: "working_plan_accepted_detailed_configuration_unconfirmed"

metric_candidates:
  - metric_id: M-VALID
    name: "Valid and sanitized SMILES"
    aliases: ["RDKit validity", "chemical validity"]
    definition: "The generated SMILES must parse to an RDKit molecule and pass sanitization."
    proposed_roles: [hard_constraint]
    direction: pass_fail
    threshold:
      value: true
      unit: boolean
      status: active_proposed
    conditions: ["RDKit parser", "RDKit sanitization"]
    acquisition: ["rdkit.Chem.MolFromSmiles", "rdkit.Chem.SanitizeMol"]
    evidence_refs: [RDKit-DOC]
    expert_status: "confirmed_as_chemical_validity_gate"
    unresolved_fields: []
  - metric_id: M-SCAFFOLD
    name: "Porphyrin scaffold preservation"
    aliases: ["scaffold gate", "porphyrin core constraint"]
    definition: "Candidate must retain a domain-approved porphyrin or porphyrinoid scaffold in the active branch."
    proposed_roles: [hard_constraint]
    direction: pass_fail
    threshold:
      value: "approved scaffold SMARTS/SMILES required"
      unit: structure_rule
      status: unresolved_until_expert_scaffold_provided
    conditions: ["round2 active branch"]
    acquisition: ["substructure search", "scaffold similarity"]
    evidence_refs: [USER-PORPHYRIN]
    expert_status: "confirmed_as_working_scaffold_family_exact_structure_unconfirmed"
    expert_feedback_refs: [PS-EO-R1-INPUTS]
    unresolved_fields: ["exact scaffold representation"]
  - metric_id: M-SOCME
    name: "Spin-orbit coupling matrix element"
    aliases: ["SOCME", "SOC(S1,Tn)", "SOC"]
    definition: "Spin-orbit coupling matrix element relevant to intersystem crossing between excited singlet and triplet states."
    proposed_roles: [primary_objective]
    direction: maximize
    threshold:
      value: 0.24
      unit: cm^-1
      status: scaffold_and_method_specific_soft_threshold
    conditions: ["same computational method", "same state definition"]
    acquisition: [physics_compute]
    evidence_refs: [PORPHYRIN-PDI-SOCME, R2-O001]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["exact state pair", "software and method", "hard vs soft threshold"]
  - metric_id: M-HL-GAP
    name: "HOMO-LUMO gap"
    aliases: ["HOMO-LUMO", "frontier orbital gap"]
    definition: "Energy gap between HOMO and LUMO, used as an electronic-structure proxy for absorption and transfer behavior."
    proposed_roles: [secondary_objective, prefilter_feature]
    direction: context_dependent
    threshold:
      value: "no universal threshold"
      unit: eV
      status: ranking_only_initially
    conditions: ["same DFT method", "same charge/spin state"]
    acquisition: [physics_compute, surrogate]
    evidence_refs: [PORPHYRIN-PDI-SOCME, R2-I007]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["preferred range for this scaffold family"]
  - metric_id: M-DELTAE-S1-T1
    name: "S1-T1 energy gap"
    aliases: ["Es1-Et1", "DeltaE_S1_T1", "DeltaEST"]
    definition: "Energy difference between the first excited singlet state and the first triplet state."
    proposed_roles: [primary_objective]
    direction: minimize_to_favorable_range
    threshold:
      value: "smaller is favorable for ISC, but not unbounded"
      unit: eV
      status: evidence_backed_direction_threshold_unresolved
    conditions: ["same TD-DFT/TDA method", "same solvent model"]
    acquisition: [physics_compute, surrogate]
    evidence_refs: [PORPHYRIN-PDI-SOCME, ORGANIC-PS-REVIEW]
    expert_status: "confirmed_as_optimization_metric"
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
    unresolved_fields: ["acceptable lower/upper range"]
  - metric_id: M-ES1
    name: "S1 excitation energy"
    aliases: ["Es1", "S1 energy"]
    definition: "Excitation energy of the first singlet excited state."
    proposed_roles: [primary_objective]
    direction: target_range
    threshold:
      value: "map to desired wavelength window via lambda=1240/E"
      unit: eV
      status: derived_target_range
    conditions: ["same TD-DFT method", "target transition selected"]
    acquisition: [physics_compute, surrogate]
    evidence_refs: [R2-I001, R2-O001]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["exact preferred energy range"]
  - metric_id: M-CHARGE
    name: "Charge profile"
    aliases: ["charge", "formal charge", "charge distribution"]
    definition: "Net charge and/or spatial charge distribution relevant to amphiphilicity, uptake, and localization."
    proposed_roles: [soft_constraint, intermediate]
    direction: target_range
    threshold:
      value: "branch-specific, avoid extremes"
      unit: "charge / descriptor"
      status: unresolved
    conditions: ["porphyrin branch", "application-dependent biological context"]
    acquisition: [derive, physics_compute]
    evidence_refs: [PORPHYRIN-CHARGE-LOGP, R2-I014]
    expert_status: "confirmed_as_optimization_metric"
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
    unresolved_fields: ["target formal charge", "charge-distribution descriptor"]
  - metric_id: M-SYMMETRY
    name: "Symmetry score"
    aliases: ["symmetry", "molecular symmetry proxy"]
    definition: "A structural or electronic symmetry proxy used as a regularizer for charge distribution, conjugation, and reproducibility."
    proposed_roles: [intermediate, design_regularizer]
    direction: context_dependent
    threshold:
      value: "moderate preference, not strict extremum"
      unit: score
      status: unresolved
    conditions: ["must not override charge or photophysics objectives"]
    acquisition: [derive]
    evidence_refs: [PORPHYRIN-CHARGE-LOGP]
    expert_status: "confirmed_as_optimization_metric"
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
    unresolved_fields: ["operational definition of symmetry"]
  - metric_id: M-SA
    name: "Synthetic accessibility"
    aliases: ["SA", "SA score"]
    definition: "Numerical estimate of synthetic accessibility or synthetic complexity."
    proposed_roles: [soft_constraint]
    direction: minimize_difficulty
    threshold:
      value: "project threshold unresolved"
      unit: score
      status: unresolved
    conditions: ["fragment RL branch", "RECAP-compatible workflow"]
    acquisition: [estimate]
    evidence_refs: [RL-FRAGMENT-REF]
    expert_status: "synthesizability_requirement_confirmed_threshold_and_implementation_unconfirmed"
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-PE-R3-SYNTHESIS]
    unresolved_fields: ["SA cutoff", "soft vs hard usage"]
  - metric_id: M-LOGP
    name: "logP"
    aliases: ["octanol/water partition coefficient"]
    definition: "Lipophilicity descriptor used to balance uptake, amphiphilicity, and aggregation risk."
    proposed_roles: [soft_constraint]
    direction: target_range
    threshold:
      value: "moderate range preferred; exact limits unresolved"
      unit: unitless
      status: evidence_backed_direction_threshold_unresolved
    conditions: ["porphyrin branch", "biological environment dependent"]
    acquisition: [estimate]
    evidence_refs: [PORPHYRIN-CHARGE-LOGP]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["target range for this project"]
  - metric_id: M-TPSA
    name: "Topological polar surface area"
    aliases: ["TPSA"]
    definition: "Topological polar surface area used as a polarity and transport control descriptor."
    proposed_roles: [soft_constraint]
    direction: target_range
    threshold:
      value: "avoid extremes; exact range unresolved"
      unit: A^2
      status: unresolved
    conditions: ["paired with logP and charge"]
    acquisition: [estimate]
    evidence_refs: [STANDARD-DEVELOPABILITY]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["target range"]
  - metric_id: M-MW
    name: "Molecular weight"
    aliases: ["WM", "MW"]
    definition: "Molecular weight used to control size growth and practical developability."
    proposed_roles: [soft_constraint]
    direction: target_range
    threshold:
      value: "avoid monotonic size growth; exact limit unresolved"
      unit: g/mol
      status: unresolved
    conditions: ["paired with scaffold-preserving branch"]
    acquisition: [estimate]
    evidence_refs: [STANDARD-DEVELOPABILITY]
    expert_status: "confirmed_for_metric_consideration"
    expert_feedback_refs: [PS-EO-R2-METRICS]
    unresolved_fields: ["exact upper/lower bounds"]

metric_decisions:
  - metric_id: M-VALID
    final_role: hard_constraint
    rank: 1
    ranking_basis: ["Foundational validity gate", "lowest computational cost"]
    direction: pass_fail
    threshold: {value: true, unit: boolean}
    evaluator_id: MODEL-001
    decision_status: proposed
    evidence_refs: [RDKit-DOC]
    expert_feedback_refs: []
  - metric_id: M-SCAFFOLD
    final_role: hard_constraint
    rank: 2
    ranking_basis: ["Porphyrin remains the common scaffold", "keeps RL search relevant"]
    direction: pass_fail
    threshold: {value: "approved scaffold required"}
    evaluator_id: MODEL-003
    decision_status: proposed
    evidence_refs: [USER-PORPHYRIN]
    expert_feedback_refs: [PS-EO-R1-INPUTS]
  - metric_id: M-SOCME
    final_role: primary_objective
    rank: 3
    ranking_basis: ["Explicitly requested by materials expert", "directly linked to ISC and ROS generation"]
    direction: maximize
    threshold: {value: 0.24, unit: cm^-1, status: soft_scaffold_specific}
    evaluator_id: MODEL-006
    decision_status: proposed
    evidence_refs: [PORPHYRIN-PDI-SOCME, ORGANIC-PS-REVIEW]
    expert_feedback_refs: [PS-EO-R2-METRICS]
  - metric_id: M-DELTAE-S1-T1
    final_role: primary_objective
    rank: 4
    ranking_basis: ["Explicitly requested by materials expert", "small DeltaEST commonly promotes ISC"]
    direction: minimize_to_favorable_range
    threshold: {value: "smaller favorable", status: unresolved_range}
    evaluator_id: MODEL-006
    decision_status: proposed
    evidence_refs: [PORPHYRIN-PDI-SOCME, ORGANIC-PS-REVIEW]
    expert_feedback_refs: [PS-EO-R2-METRICS, PS-EO-R3-SELECTION]
  - metric_id: M-ES1
    final_role: primary_objective
